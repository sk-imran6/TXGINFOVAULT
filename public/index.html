<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TXG Information Center</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:#070b12;
  color:#f5f7fa
}

body{padding:16px}

button,input,select{font:inherit}

button{cursor:pointer}

.hidden{display:none!important}

/* LOGIN */

#loginPage{
  min-height:90vh;
  display:flex;
  align-items:center;
  justify-content:center
}

.login-box{
  width:100%;
  max-width:390px;
  padding:28px;
  background:#0d131d;
  border:1px solid #202a39;
  border-radius:18px;
  box-shadow:0 15px 45px rgba(0,0,0,.35)
}

.login-title{
  font-size:27px;
  font-weight:800;
  margin-bottom:7px
}

.login-subtitle{
  color:#8e9aaa;
  font-size:14px;
  margin-bottom:25px
}

.input-label{
  display:block;
  font-size:13px;
  color:#aab4c3;
  margin-bottom:7px
}

.input{
  width:100%;
  border:1px solid #273344;
  background:#080d15;
  color:#fff;
  border-radius:11px;
  padding:13px 14px;
  outline:none
}

.input:focus{
  border-color:#4c8dff
}

.login-btn{
  width:100%;
  margin-top:15px;
  padding:13px;
  border:0;
  border-radius:11px;
  background:#347cff;
  color:#fff;
  font-weight:700
}

.login-btn:disabled{
  opacity:.6
}

.login-error{
  min-height:20px;
  margin-top:12px;
  color:#ff6978;
  font-size:13px
}

/* APP */

#appPage{
  max-width:1100px;
  margin:0 auto
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px
}

.brand-title{
  font-size:25px;
  font-weight:800
}

.brand-subtitle{
  color:#7f8b9d;
  font-size:13px;
  margin-top:4px
}

.logout-btn{
  border:1px solid #303b4d;
  background:#101722;
  color:#e7ebf1;
  padding:9px 14px;
  border-radius:9px
}

.section{
  background:#0d131d;
  border:1px solid #202a39;
  border-radius:17px;
  padding:18px;
  margin-bottom:18px
}

.section-title{
  font-size:17px;
  font-weight:750;
  margin-bottom:14px
}

/* SEARCH */

.search-row{
  display:flex;
  gap:10px
}

.search-row .input{
  flex:1
}

.search-btn{
  min-width:105px;
  border:0;
  border-radius:10px;
  background:#347cff;
  color:#fff;
  font-weight:700;
  padding:0 18px
}

.detected{
  margin-top:9px;
  color:#8490a2;
  font-size:12px
}

/* TOOLS */

.tools-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px
}

.tool{
  min-height:48px;
  border:1px solid #263244;
  background:#101722;
  color:#eef2f7;
  border-radius:11px;
  padding:12px 13px;
  text-align:left;
  font-weight:650
}

.tool:hover{
  border-color:#4a78bd;
  background:#141d2a
}

.tool.active{
  border-color:#347cff;
  background:#142544
}

.custom-tool-row{
  display:flex;
  gap:7px
}

.custom-tool-row .tool{
  flex:1
}

.remove{
  width:44px;
  border:1px solid #42252c;
  background:#1c1014;
  color:#ff7482;
  border-radius:10px;
  font-size:18px
}

/* RESULT */

.result-box{
  min-height:100px;
  background:#080d15;
  border:1px solid #202a39;
  border-radius:12px;
  padding:15px;
  overflow:auto
}

.result-loading{color:#8da9d8}
.result-error{color:#ff6f7d}
.result-empty{color:#697689}

pre{
  white-space:pre-wrap;
  word-break:break-word;
  margin:0;
  color:#dfe6ef;
  font-family:Consolas,monospace;
  font-size:13px
}

/* CUSTOM API */

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px
}

.form-full{
  grid-column:1/-1
}

.field label{
  display:block;
  color:#aab4c3;
  font-size:12px;
  margin-bottom:6px
}

.save-api-btn{
  border:0;
  background:#2779e8;
  color:#fff;
  border-radius:10px;
  padding:12px 16px;
  font-weight:700
}

.status{
  color:#8c99aa;
  font-size:12px;
  margin-top:10px;
  min-height:18px
}

.saved-list{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-top:13px
}

.small{
  color:#737f91;
  font-size:12px
}

@media(max-width:650px){

  body{padding:12px}

  .topbar{
    align-items:flex-start
  }

  .brand-title{
    font-size:21px
  }

  .section{
    padding:14px;
    border-radius:14px
  }

  .search-row{
    flex-direction:column
  }

  .search-btn{
    min-height:46px
  }

  .form-grid{
    grid-template-columns:1fr
  }

  .form-full{
    grid-column:auto
  }
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="loginPage">

  <div class="login-box">

    <div class="login-title">
      TXG Information
    </div>

    <div class="login-subtitle">
      Secure Admin Information Center
    </div>

    <label
      class="input-label"
      for="password"
    >
      Admin Password
    </label>

    <input
      id="password"
      class="input"
      type="password"
      autocomplete="current-password"
      placeholder="Enter password"
    >

    <button
      id="loginBtn"
      class="login-btn"
      type="button"
    >
      Login
    </button>

    <div
      id="loginError"
      class="login-error"
    ></div>

  </div>

</div>


<!-- ================= APP ================= -->

<div id="appPage" class="hidden">

  <div class="topbar">

    <div>

      <div class="brand-title">
        TXG Information Center
      </div>

      <div class="brand-subtitle">
        Search & information tools
      </div>

    </div>

    <button
      id="logoutBtn"
      class="logout-btn"
      type="button"
    >
      Logout
    </button>

  </div>


  <!-- SEARCH -->

  <div class="section">

    <div class="section-title">
      Information Search
    </div>

    <div class="search-row">

      <input
        id="searchInput"
        class="input"
        type="text"
        autocomplete="off"
        placeholder="Enter mobile, email, IP, PIN, IFSC, UPI, URL..."
      >

      <button
        id="searchBtn"
        class="search-btn"
        type="button"
      >
        Search
      </button>

    </div>

    <div
      id="detectedType"
      class="detected"
    >
      Auto detection enabled
    </div>

  </div>


  <!-- TOOLS -->

  <div class="section">

    <div class="section-title">
      Tools
    </div>

    <div
      id="toolsGrid"
      class="tools-grid"
    >

      <button
        class="tool"
        data-type="auto"
        type="button"
      >
        Auto
      </button>

      <button
        class="tool"
        data-type="mobile"
        type="button"
      >
        Mobile
      </button>

      <button
        class="tool"
        data-type="email"
        type="button"
      >
        Email
      </button>

      <button
        class="tool"
        data-type="vehicle"
        type="button"
      >
        Vehicle
      </button>

      <button
        class="tool"
        data-type="ip"
        type="button"
      >
        IP
      </button>

      <button
        class="tool"
        data-type="url"
        type="button"
      >
        URL
      </button>

      <button
        class="tool"
        data-type="pin"
        type="button"
      >
        PIN
      </button>

      <button
        class="tool"
        data-type="ifsc"
        type="button"
      >
        IFSC
      </button>

      <button
        class="tool"
        data-type="upi"
        type="button"
      >
        UPI
      </button>

      <button
        class="tool"
        data-type="company"
        type="button"
      >
        Company
      </button>

      <button
        class="tool"
        data-type="crm"
        type="button"
      >
        CRM
      </button>

      <button
        id="customApiTool"
        class="tool"
        data-type="custom-manager"
        type="button"
      >
        Custom API
      </button>

    </div>

  </div>


  <!-- RESULT -->

  <div class="section">

    <div class="section-title">
      Result
    </div>

    <div
      id="resultBox"
      class="result-box"
    >

      <div class="result-empty">
        Search result will appear here.
      </div>

    </div>

  </div>


  <!-- CUSTOM API -->

  <div
    id="customApiSection"
    class="section hidden"
  >

    <div class="section-title">
      Custom API
    </div>

    <div
      class="small"
      style="margin-bottom:14px;"
    >
      Use <b>{message}</b> in the URL.
      Your search value will replace it.
    </div>


    <div class="form-grid">

      <div class="field">

        <label for="apiName">
          API Name
        </label>

        <input
          id="apiName"
          class="input"
          type="text"
          placeholder="My API"
        >

      </div>


      <div class="field">

        <label for="apiMethod">
          Method
        </label>

        <select
          id="apiMethod"
          class="input"
        >

          <option value="GET">GET</option>
          <option value="POST">POST</option>
          <option value="PUT">PUT</option>
          <option value="PATCH">PATCH</option>
          <option value="DELETE">DELETE</option>

        </select>

      </div>


      <div class="field form-full">

        <label for="apiUrl">
          API URL
        </label>

        <input
          id="apiUrl"
          class="input"
          type="text"
          placeholder="https://example.com/search?query={message}"
        >

      </div>


      <div class="field">

        <label for="apiKey">
          API Key
        </label>

        <input
          id="apiKey"
          class="input"
          type="password"
          autocomplete="off"
          placeholder="Optional"
        >

      </div>


      <div class="field">

        <label for="apiHeader">
          API Key Header
        </label>

        <input
          id="apiHeader"
          class="input"
          type="text"
          value="Authorization"
          placeholder="Authorization"
        >

      </div>


      <div class="field form-full">

        <label for="apiDescription">
          Description
        </label>

        <input
          id="apiDescription"
          class="input"
          type="text"
          placeholder="Optional description"
        >

      </div>


      <div class="form-full">

        <button
          id="saveApi"
          class="save-api-btn"
          type="button"
        >
          Save API
        </button>

        <div
          id="customStatus"
          class="status"
        ></div>

      </div>

    </div>


    <div
      id="savedApis"
      class="saved-list"
    >

      <div class="small">
        Loading saved APIs...
      </div>

    </div>

  </div>

</div>


<script>

/* =========================================================
   STATE
========================================================= */

let selectedType = "auto";

window.savedApisCache = [];


/* =========================================================
   ELEMENTS
========================================================= */

const loginPage =
  document.getElementById("loginPage");

const appPage =
  document.getElementById("appPage");

const passwordInput =
  document.getElementById("password");

const loginBtn =
  document.getElementById("loginBtn");

const loginError =
  document.getElementById("loginError");

const logoutBtn =
  document.getElementById("logoutBtn");

const searchInput =
  document.getElementById("searchInput");

const searchBtn =
  document.getElementById("searchBtn");

const resultBox =
  document.getElementById("resultBox");

const detectedType =
  document.getElementById("detectedType");

const toolsGrid =
  document.getElementById("toolsGrid");

const customApiTool =
  document.getElementById("customApiTool");

const customApiSection =
  document.getElementById("customApiSection");

const savedApisBox =
  document.getElementById("savedApis");

const customStatus =
  document.getElementById("customStatus");


/* =========================================================
   PAGE STATE
========================================================= */

function showLogin(){

  loginPage.classList.remove("hidden");
  appPage.classList.add("hidden");

}


function showApp(){

  loginPage.classList.add("hidden");
  appPage.classList.remove("hidden");

  loadSavedApis();

}


/* =========================================================
   AUTH CHECK
   IMPORTANT:
   ONLY authenticated === true is accepted.
========================================================= */

async function checkLogin(){

  try{

    const response =
      await fetch(
        "/api/auth",
        {
          method:"GET",
          credentials:"include",
          cache:"no-store"
        }
      );

    let data = {};

    try{
      data = await response.json();
    }catch(_){
      data = {};
    }

    console.log(
      "AUTH CHECK:",
      data
    );

    if(
      response.ok &&
      data.authenticated === true
    ){

      showApp();

    }else{

      showLogin();

    }

  }catch(error){

    console.error(
      "AUTH CHECK ERROR:",
      error
    );

    showLogin();

  }

}


/* =========================================================
   LOGIN
========================================================= */

loginBtn.addEventListener(
  "click",
  login
);


passwordInput.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){
      login();
    }

  }
);


async function login(){

  const password =
    passwordInput.value;

  loginError.textContent = "";


  if(!password){

    loginError.textContent =
      "Enter admin password.";

    return;

  }


  loginBtn.disabled = true;
  loginBtn.textContent =
    "Logging in...";


  try{

    const response =
      await fetch(
        "/api/auth",
        {
          method:"POST",
          credentials:"include",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            action:"login",
            password:password
          })
        }
      );


    let data = {};

    try{
      data = await response.json();
    }catch(_){
      data = {};
    }


    console.log(
      "LOGIN RESPONSE:",
      data
    );


    /*
     * IMPORTANT:
     * Don't use data.success alone.
     */

    if(
      !response.ok ||
      data.authenticated !== true
    ){

      loginError.textContent =
        data.error ||
        data.message ||
        "Invalid password.";

      return;

    }


    passwordInput.value = "";

    showApp();


  }catch(error){

    console.error(
      "LOGIN ERROR:",
      error
    );

    loginError.textContent =
      "Login request failed.";

  }finally{

    loginBtn.disabled = false;
    loginBtn.textContent =
      "Login";

  }

}


/* =========================================================
   LOGOUT
========================================================= */

logoutBtn.addEventListener(
  "click",
  async function(){

    try{

      await fetch(
        "/api/auth",
        {
          method:"POST",
          credentials:"include",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            action:"logout"
          })
        }
      );

    }catch(_){}

    showLogin();

  }
);


/* =========================================================
   TYPE DETECTION
========================================================= */

function detectType(value){

  const v =
    String(value || "").trim();


  if(!v){
    return "auto";
  }


  if(
    /^https?:\/\//i.test(v) ||
    /^www\./i.test(v)
  ){
    return "url";
  }


  if(
    /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)
  ){
    return "email";
  }


  if(
    /^(?:\d{1,3}\.){3}\d{1,3}$/.test(v) ||
    v.includes(":")
  ){
    return "ip";
  }


  if(
    /^[A-Z]{4}0[A-Z0-9]{6}$/i.test(v)
  ){
    return "ifsc";
  }


  if(
    /^[a-zA-Z0-9._-]+@[a-zA-Z0-9._-]+$/.test(v)
  ){
    return "upi";
  }


  if(
    /^\d{6}$/.test(v)
  ){
    return "pin";
  }


  if(
    /^\+?[0-9][0-9\s-]{7,14}$/.test(v)
  ){
    return "mobile";
  }


  return "auto";

}


/* =========================================================
   SELECT TOOL
========================================================= */

function selectTool(type){

  selectedType = type;


  toolsGrid
    .querySelectorAll(".tool")
    .forEach(
      function(button){

        button.classList.remove(
          "active"
        );

        if(
          button.dataset.type === type
        ){

          button.classList.add(
            "active"
          );

        }

      }
    );


  if(
    type === "custom-manager"
  ){

    customApiSection
      .classList
      .remove("hidden");

  }else{

    customApiSection
      .classList
      .add("hidden");

  }


  if(type === "auto"){

    detectedType.textContent =
      "Auto detection enabled";

  }else if(
    type !== "custom-manager"
  ){

    detectedType.textContent =
      "Selected: " +
      type.toUpperCase();

  }

}


/* =========================================================
   TOOL CLICK
========================================================= */

toolsGrid.addEventListener(
  "click",
  function(event){

    const button =
      event.target.closest(
        ".tool"
      );


    if(!button){
      return;
    }


    if(
      button.dataset.savedApi === "true"
    ){

      const api =
        window.savedApisCache.find(
          function(item){

            return String(item.id) ===
              String(button.dataset.apiId);

          }
        );


      if(api){
        runSavedApi(api);
      }

      return;

    }


    if(
      button.id === "customApiTool"
    ){

      selectTool(
        "custom-manager"
      );

      customApiSection.scrollIntoView({
        behavior:"smooth",
        block:"start"
      });

      return;

    }


    selectTool(
      button.dataset.type || "auto"
    );


    if(
      button.dataset.type !==
      "custom-manager"
    ){

      runLookup();

    }

  }
);


/* =========================================================
   SEARCH INPUT
========================================================= */

searchInput.addEventListener(
  "input",
  function(){

    if(
      selectedType === "auto"
    ){

      const detected =
        detectType(
          searchInput.value
        );


      if(
        detected !== "auto"
      ){

        detectedType.textContent =
          "Detected: " +
          detected.toUpperCase();

      }else{

        detectedType.textContent =
          "Auto detection enabled";

      }

    }

  }
);


searchInput.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      if(
        selectedType ===
        "custom-manager"
      ){
        return;
      }

      runLookup();

    }

  }
);


searchBtn.addEventListener(
  "click",
  runLookup
);


/* =========================================================
   NORMAL LOOKUP
========================================================= */

async function runLookup(){

  const value =
    searchInput.value.trim();


  if(!value){

    showResult({
      success:false,
      error:"Enter a value first."
    });

    return;

  }


  let type =
    selectedType;


  if(
    type === "auto" ||
    type === "custom-manager"
  ){

    type =
      detectType(value);

  }


  showResult({
    status:"loading",
    message:
      "Searching " +
      type.toUpperCase() +
      "..."
  });


  try{

    const url =
      "/api/lookup?type=" +
      encodeURIComponent(type) +
      "&value=" +
      encodeURIComponent(value);


    const response =
      await fetch(
        url,
        {
          method:"GET",
          credentials:"include",
          cache:"no-store"
        }
      );


    let data = {};

    try{
      data = await response.json();
    }catch(_){

      data = {
        success:false,
        error:
          "Server returned invalid response."
      };

    }


    if(
      response.status === 401
    ){

      showLogin();
      return;

    }


    if(!response.ok){

      showResult({
        success:false,
        error:
          data.error ||
          "Lookup failed."
      });

      return;

    }


    showResult(data);


  }catch(error){

    showResult({
      success:false,
      error:
        error.message ||
        "Request failed."
    });

  }

}


/* =========================================================
   RESULT
========================================================= */

function showResult(data){

  resultBox.innerHTML = "";


  if(
    data &&
    data.status === "loading"
  ){

    const div =
      document.createElement("div");

    div.className =
      "result-loading";

    div.textContent =
      data.message ||
      "Loading...";

    resultBox.appendChild(div);

    return;

  }


  if(
    data &&
    data.success === false
  ){

    const div =
      document.createElement("div");

    div.className =
      "result-error";

    div.textContent =
      data.error ||
      "Something went wrong.";

    resultBox.appendChild(div);

    return;

  }


  const pre =
    document.createElement("pre");


  try{

    if(
      typeof data === "string"
    ){

      pre.textContent =
        data;

    }else{

      pre.textContent =
        JSON.stringify(
          data,
          null,
          2
        );

    }

  }catch(_){

    pre.textContent =
      String(data);

  }


  resultBox.appendChild(pre);

}


/* =========================================================
   LOAD SAVED APIs
========================================================= */

async function loadSavedApis(){

  savedApisBox.innerHTML =
    "<div class='small'>Loading saved APIs...</div>";


  try{

    const response =
      await fetch(
        "/api/custom-apis",
        {
          method:"GET",
          credentials:"include",
          cache:"no-store"
        }
      );


    if(
      response.status === 401
    ){

      showLogin();
      return;

    }


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "Could not load APIs."
      );

    }


    const apis =
      Array.isArray(data.apis)
        ? data.apis
        : [];


    window.savedApisCache =
      apis;


    /*
     * Remove old saved tool buttons.
     */

    toolsGrid
      .querySelectorAll(
        ".saved-api-row"
      )
      .forEach(
        function(row){
          row.remove();
        }
      );


    savedApisBox.innerHTML = "";


    if(!apis.length){

      savedApisBox.innerHTML =
        "<div class='small'>No saved APIs.</div>";

      return;

    }


    apis.forEach(
      function(api){

        /* TOOL BUTTON */

        const row =
          document.createElement("div");

        row.className =
          "custom-tool-row saved-api-row";


        const button =
          document.createElement("button");

        button.type = "button";

        button.className =
          "tool";

        button.dataset.savedApi =
          "true";

        button.dataset.apiId =
          String(api.id);

        button.textContent =
          api.name || "Saved API";


        button.addEventListener(
          "click",
          function(){

            runSavedApi(api);

          }
        );


        const remove =
          document.createElement("button");

        remove.type = "button";

        remove.className =
          "remove";

        remove.textContent =
          "×";

        remove.title =
          "Remove API";


        remove.addEventListener(
          "click",
          function(event){

            event.stopPropagation();

            removeSavedApi(
              api.id
            );

          }
        );


        row.appendChild(button);
        row.appendChild(remove);


        /*
         * Always before Custom API.
         */

        toolsGrid.insertBefore(
          row,
          customApiTool
        );


        /* MANAGER LIST */

        const managerRow =
          document.createElement("div");

        managerRow.className =
          "custom-tool-row";


        const managerButton =
          document.createElement("button");

        managerButton.type =
          "button";

        managerButton.className =
          "tool";

        managerButton.textContent =
          api.name || "Saved API";


        managerButton.addEventListener(
          "click",
          function(){

            runSavedApi(api);

          }
        );


        const managerRemove =
          document.createElement("button");

        managerRemove.type =
          "button";

        managerRemove.className =
          "remove";

        managerRemove.textContent =
          "×";


        managerRemove.addEventListener(
          "click",
          function(){

            removeSavedApi(
              api.id
            );

          }
        );


        managerRow.appendChild(
          managerButton
        );

        managerRow.appendChild(
          managerRemove
        );


        savedApisBox.appendChild(
          managerRow
        );

      }
    );


  }catch(error){

    savedApisBox.innerHTML =
      "<div class='small'>" +
      escapeHtml(
        error.message ||
        "Failed to load APIs."
      ) +
      "</div>";

  }

}


/* =========================================================
   RUN SAVED API
========================================================= */

async function runSavedApi(api){

  const value =
    searchInput.value.trim();


  if(!value){

    showResult({
      success:false,
      error:
        "Enter something in the search box first."
    });

    searchInput.focus();

    return;

  }


  showResult({
    status:"loading",
    message:
      "Calling " +
      (api.name || "API") +
      "..."
  });


  try{

    const response =
      await fetch(
        "/api/custom-proxy",
        {
          method:"POST",
          credentials:"include",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            id:api.id,
            message:value
          })
        }
      );


    let data = {};

    try{
      data = await response.json();
    }catch(_){

      data = {
        success:false,
        error:
          "Invalid server response."
      };

    }


    if(
      response.status === 401
    ){

      showLogin();
      return;

    }


    if(!response.ok){

      showResult({
        success:false,
        error:
          data.error ||
          "API request failed."
      });

      return;

    }


    showResult(
      data.response
    );


  }catch(error){

    showResult({
      success:false,
      error:
        error.message ||
        "Failed to call API."
    });

  }

}


/* =========================================================
   REMOVE API
========================================================= */

async function removeSavedApi(id){

  if(
    !confirm(
      "Remove this saved API?"
    )
  ){

    return;

  }


  try{

    const response =
      await fetch(
        "/api/custom-apis",
        {
          method:"DELETE",
          credentials:"include",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            id:id
          })
        }
      );


    const data =
      await response.json();


    if(
      response.status === 401
    ){

      showLogin();
      return;

    }


    if(!response.ok){

      alert(
        data.error ||
        "Could not remove API."
      );

      return;

    }


    await loadSavedApis();


  }catch(error){

    alert(
      error.message ||
      "Failed to remove API."
    );

  }

}


/* =========================================================
   SAVE CUSTOM API
========================================================= */

document
  .getElementById("saveApi")
  .addEventListener(
    "click",
    saveCustomApi
  );


async function saveCustomApi(){

  const name =
    document
      .getElementById("apiName")
      .value
      .trim();


  const url =
    document
      .getElementById("apiUrl")
      .value
      .trim();


  const method =
    document
      .getElementById("apiMethod")
      .value;


  const apiKey =
    document
      .getElementById("apiKey")
      .value
      .trim();


  const apiHeader =
    document
      .getElementById("apiHeader")
      .value
      .trim() ||
    "Authorization";


  const description =
    document
      .getElementById("apiDescription")
      .value
      .trim();


  customStatus.textContent = "";


  if(!name){

    customStatus.textContent =
      "Enter API name.";

    return;

  }


  if(
    !/^https?:\/\//i.test(url)
  ){

    customStatus.textContent =
      "Enter a valid API URL.";

    return;

  }


  if(
    !url.includes("{message}")
  ){

    customStatus.textContent =
      "URL must contain {message}.";

    return;

  }


  customStatus.textContent =
    "Saving...";


  try{

    const response =
      await fetch(
        "/api/custom-apis",
        {
          method:"POST",
          credentials:"include",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({

            name:name,

            url:url,

            method:method,

            api_key:apiKey,

            api_header:apiHeader,

            description:description,

            category:"Custom API"

          })
        }
      );


    const data =
      await response.json();


    if(
      response.status === 401
    ){

      showLogin();
      return;

    }


    if(!response.ok){

      customStatus.textContent =
        data.error ||
        "Save failed.";

      return;

    }


    customStatus.textContent =
      "API saved successfully.";


    document
      .getElementById("apiName")
      .value = "";


    document
      .getElementById("apiUrl")
      .value = "";


    document
      .getElementById("apiKey")
      .value = "";


    document
      .getElementById("apiDescription")
      .value = "";


    await loadSavedApis();


  }catch(error){

    customStatus.textContent =
      error.message ||
      "Failed to save API.";

  }

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

selectTool("auto");

checkLogin();
