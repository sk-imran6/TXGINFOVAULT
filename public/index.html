<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TXG Information</title>
<style>
:root{--bg:#07090d;--panel:#10151d;--panel2:#151c27;--line:#27313f;--text:#f4f7fb;--muted:#91a0b2;--accent:#6ee7b7;--bad:#ff8995}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#182530,#07090d 50%);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}
.wrap{width:min(1160px,94%);margin:auto}
.top{padding:26px 0 18px;display:flex;justify-content:space-between;align-items:center;gap:15px}
.logo{font-size:27px;font-weight:900;letter-spacing:.3px}
.sub{font-size:13px;color:var(--muted);margin-top:4px}
.btn,.input{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:12px 14px;font:inherit}
.btn{cursor:pointer}.btn:hover{border-color:#4c6079}
.primary{background:var(--accent);color:#06100b;border:0;font-weight:850}
.logout{color:#ff9da7}.hidden{display:none!important}
.login,.searchbox,.card{background:rgba(16,21,29,.95);border:1px solid var(--line);border-radius:18px;padding:22px}
.login{max-width:430px;margin:80px auto}
.login h1{margin:0 0 5px}
.login .input{width:100%;margin:18px 0 10px}
.login .primary{width:100%}
.searchrow{display:grid;grid-template-columns:1fr 135px;gap:10px}
.searchrow .input{width:100%}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tool.active{color:var(--accent);border-color:var(--accent)}
.status{font-size:13px;color:var(--muted);margin-top:12px}
.ok{color:#9bf2c9}.error{color:var(--bad)}
.results{display:grid;gap:14px;margin:16px 0 40px}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:11px;margin-bottom:11px}
.name{font-weight:850}.source{font-size:11px;color:var(--accent);border:1px solid #2b5144;border-radius:99px;padding:4px 8px}
.state{font-size:12px;color:var(--muted)}
pre{white-space:pre-wrap;overflow:auto;font-size:12px;line-height:1.6;margin:0;color:#dce4ed}
@media(max-width:650px){.searchrow{grid-template-columns:1fr}.searchrow .btn{width:100%}.top{align-items:flex-start}}
</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <div>
    <div class="logo">TXG Information</div>
    <div class="sub">Connected public & authorized lookup center</div>
  </div>
  <button id="logout" class="btn logout hidden">Logout</button>
</header>

<section id="loginBox" class="login">
  <h1>Admin Login</h1>
  <div class="sub">Secure server-side session.</div>
  <input id="password" class="input" type="password" placeholder="Admin password" autocomplete="current-password">
  <button id="login" class="btn primary">Login</button>
  <div id="loginMsg" class="status"></div>
</section>

<main id="app" class="hidden">

<section class="searchbox">
  <div class="searchrow">
    <input id="query" class="input" placeholder="Mobile, Email, IP, URL, PIN, IFSC, UPI, Vehicle or Company">
    <button id="search" class="btn primary">Search</button>
  </div>

  <div id="tools" class="tools"></div>
  <div id="status" class="status">Ready.</div>
</section>

<section id="results" class="results"></section>

</main>
</div>

<script>
const tools=[
  ["auto","Auto"],
  ["mobile","Mobile"],
  ["email","Email"],
  ["vehicle","Vehicle"],
  ["ip","IP"],
  ["url","URL"],
  ["pin","PIN"],
  ["ifsc","IFSC"],
  ["upi","UPI"],
  ["company","Company"],
  ["crm","CRM"],
  ["custom","Custom API"]
];

let selected="auto";
const $=id=>document.getElementById(id);

function message(el,text,className=""){
  el.textContent=text;
  el.className="status "+className;
}

function drawTools(){
  $("tools").innerHTML="";
  tools.forEach(([key,label])=>{
    const b=document.createElement("button");
    b.type="button";
    b.className="btn tool"+(key===selected?" active":"");
    b.textContent=label;
    b.onclick=()=>{
      selected=key;
      drawTools();
    };
    $("tools").appendChild(b);
  });
}

function showApp(){
  $("loginBox").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("logout").classList.remove("hidden");
  drawTools();
}

function showLogin(){
  $("loginBox").classList.remove("hidden");
  $("app").classList.add("hidden");
  $("logout").classList.add("hidden");
}

async function login(){
  message($("loginMsg"),"Checking...");
  try{
    const r=await fetch("/api/auth",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        action:"login",
        password:$("password").value
      })
    });

    const d=await r.json();

    if(!r.ok) throw new Error(d.error||"Login failed");

    showApp();
  }catch(e){
    message($("loginMsg"),e.message,"error");
  }
}

async function logout(){
  try{
    await fetch("/api/auth",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({action:"logout"})
    });
  }finally{
    showLogin();
  }
}

function renderResults(data){
  const root=$("results");
  root.innerHTML="";

  if(!data.results || !data.results.length){
    root.innerHTML='<div class="card state">No results returned.</div>';
    return;
  }

  data.results.forEach(item=>{
    const card=document.createElement("article");
    card.className="card";

    const head=document.createElement("div");
    head.className="head";

    const name=document.createElement("div");
    name.className="name";
    name.textContent=item.name||"RESULT";

    const source=document.createElement("div");
    source.className="source";
    source.textContent=(item.source||"SOURCE")+" · "+(item.status||"success");

    const pre=document.createElement("pre");
    pre.textContent=
      typeof item.data==="string"
        ? item.data
        : JSON.stringify(item.data,null,2);

    head.append(name,source);
    card.append(head,pre);
    root.appendChild(card);
  });
}

async function search(){
  const value=$("query").value.trim();

  if(!value){
    message($("status"),"Enter a value first.");
    return;
  }

  message($("status"),"Searching...");
  $("results").innerHTML="";

  try{
    const url=
      "/api/lookup?type="+
      encodeURIComponent(selected)+
      "&value="+
      encodeURIComponent(value);

    const r=await fetch(url,{cache:"no-store"});
    const d=await r.json();

    if(r.status===401){
      showLogin();
      message($("loginMsg"),"Session expired. Login again.","error");
      return;
    }

    if(!r.ok) throw new Error(d.error||"Lookup failed");

    renderResults(d);
    message(
      $("status"),
      `${d.result_count||0} result block(s) returned.`,
      "ok"
    );
  }catch(e){
    $("results").innerHTML=
      `<div class="card error">${e.message}</div>`;
    message($("status"),"Search failed.","error");
  }
}

$("login").onclick=login;
$("logout").onclick=logout;
$("search").onclick=search;

$("password").addEventListener("keydown",e=>{
  if(e.key==="Enter") login();
});

$("query").addEventListener("keydown",e=>{
  if(e.key==="Enter") search();
});

fetch("/api/auth",{cache:"no-store"})
  .then(r=>r.json())
  .then(d=>{
    if(d.authenticated) showApp();
    else showLogin();
  })
  .catch(showLogin);
</script>
</body>
</html>
