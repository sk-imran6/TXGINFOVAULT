<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>TXG Information Center</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #08090d;
      color: #f5f7fb;
    }

    .container {
      width: min(1100px, 94%);
      margin: 30px auto;
    }

    .header {
      margin-bottom: 25px;
    }

    .header h1 {
      margin: 0;
      font-size: 30px;
    }

    .header p {
      color: #8d94a6;
      margin-top: 8px;
    }

    .tools {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }

    .tool {
      border: 1px solid #202431;
      background: #11131a;
      color: #fff;
      padding: 14px 10px;
      border-radius: 12px;
      cursor: pointer;
      transition: .2s;
    }

    .tool:hover,
    .tool.active {
      border-color: #5d6cff;
      background: #171a27;
    }

    .panel {
      background: #101219;
      border: 1px solid #202431;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .panel h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .search-row {
      display: flex;
      gap: 10px;
    }

    input,
    select {
      width: 100%;
      background: #080a0f;
      color: #fff;
      border: 1px solid #292e3b;
      border-radius: 10px;
      padding: 13px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #5d6cff;
    }

    button {
      font-family: inherit;
    }

    .primary {
      border: 0;
      background: #5d6cff;
      color: #fff;
      padding: 13px 20px;
      border-radius: 10px;
      cursor: pointer;
      white-space: nowrap;
    }

    .primary:hover {
      opacity: .9;
    }

    .result {
      margin-top: 18px;
    }

    .loading,
    .error,
    .empty {
      padding: 15px;
      border-radius: 10px;
      background: #0a0c11;
      border: 1px solid #242938;
    }

    .error {
      color: #ff7f7f;
      border-color: #5c2727;
    }

    .result-card {
      background: #0a0c11;
      border: 1px solid #242938;
      border-radius: 12px;
      overflow: hidden;
    }

    .result-head {
      padding: 14px;
      border-bottom: 1px solid #242938;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .result-head span {
      color: #8d94a6;
      font-size: 13px;
    }

    pre {
      margin: 0;
      padding: 15px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
      color: #dce1ee;
      font-size: 13px;
      line-height: 1.55;
    }

    .api-form {
      display: grid;
      gap: 10px;
    }

    .api-grid {
      display: grid;
      grid-template-columns:
        1fr 1fr;
      gap: 10px;
    }

    .saved-api {
      border: 1px solid #252a36;
      background: #0b0d12;
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
    }

    .saved-api-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .saved-api-name {
      font-weight: 700;
    }

    .saved-api-url {
      color: #777f92;
      font-size: 12px;
      margin-top: 5px;
      word-break: break-all;
    }

    .api-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .small-btn {
      border: 1px solid #2a3040;
      background: #141720;
      color: #fff;
      border-radius: 8px;
      padding: 9px 12px;
      cursor: pointer;
    }

    .small-btn:hover {
      border-color: #5d6cff;
    }

    .delete-btn:hover {
      border-color: #ff4f4f;
      color: #ff7474;
    }

    .api-runner {
      display: none;
      margin-top: 15px;
    }

    .api-runner.show {
      display: block;
    }

    .muted {
      color: #7e8699;
      font-size: 13px;
    }

    @media (max-width: 650px) {

      .container {
        width: 92%;
        margin: 20px auto;
      }

      .search-row {
        flex-direction: column;
      }

      .api-grid {
        grid-template-columns: 1fr;
      }

      .saved-api-top {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>TXG Information Center</h1>
    <p>
      Search public and authorized information from one place.
    </p>
  </div>

  <div class="tools">

    <button
      class="tool active"
      data-type="auto"
    >
      Auto
    </button>

    <button
      class="tool"
      data-type="mobile"
    >
      Mobile
    </button>

    <button
      class="tool"
      data-type="email"
    >
      Email
    </button>

    <button
      class="tool"
      data-type="vehicle"
    >
      Vehicle
    </button>

    <button
      class="tool"
      data-type="ip"
    >
      IP
    </button>

    <button
      class="tool"
      data-type="url"
    >
      URL
    </button>

    <button
      class="tool"
      data-type="pin"
    >
      PIN
    </button>

    <button
      class="tool"
      data-type="ifsc"
    >
      IFSC
    </button>

    <button
      class="tool"
      data-type="upi"
    >
      UPI
    </button>

    <button
      class="tool"
      data-type="company"
    >
      Company
    </button>

    <button
      class="tool"
      data-type="crm"
    >
      CRM
    </button>

    <button
      class="tool"
      data-type="custom"
    >
      Custom API
    </button>

  </div>

  <div class="panel">

    <h2>Information Lookup</h2>

    <div class="search-row">

      <input
        id="searchInput"
        type="text"
        autocomplete="off"
        placeholder="Enter mobile, email, IP, PIN, IFSC, UPI, URL..."
      >

      <button
        id="searchButton"
        class="primary"
        type="button"
      >
        Search
      </button>

    </div>

    <div
      id="result"
      class="result"
    ></div>

  </div>

  <div
    id="customApiPanel"
    class="panel"
    style="display:none;"
  >

    <h2>Custom API Manager</h2>

    <p class="muted">
      Save your own HTTPS API and run it from the dashboard.
    </p>

    <form
      id="apiForm"
      class="api-form"
    >

      <div class="api-grid">

        <input
          id="apiName"
          type="text"
          placeholder="API Name"
          required
        >

        <select id="apiMethod">

          <option value="GET">
            GET
          </option>

          <option value="POST">
            POST
          </option>

          <option value="PUT">
            PUT
          </option>

          <option value="PATCH">
            PATCH
          </option>

          <option value="DELETE">
            DELETE
          </option>

        </select>

      </div>

      <input
        id="apiUrl"
        type="url"
        placeholder="https://example.com/api?value={message}"
        required
      >

      <input
        id="apiDescription"
        type="text"
        placeholder="Description (optional)"
      >

      <button
        class="primary"
        type="submit"
      >
        Add API
      </button>

    </form>

    <div
      id="savedApis"
      style="margin-top:20px;"
    ></div>

    <div
      id="apiRunner"
      class="api-runner"
    >

      <input
        id="apiRunnerInput"
        type="text"
        placeholder="Enter value..."
      >

      <button
        id="apiRunButton"
        class="primary"
        type="button"
        style="margin-top:10px;"
      >
        Run API
      </button>

      <div
        id="apiRunnerResult"
        class="result"
      ></div>

    </div>

  </div>

</div>

<script>

let selectedType = "auto";
let selectedAPI = null;

const tools =
  document.querySelectorAll(".tool");

const searchInput =
  document.getElementById("searchInput");

const searchButton =
  document.getElementById("searchButton");

const resultBox =
  document.getElementById("result");

const customApiPanel =
  document.getElementById("customApiPanel");

const apiForm =
  document.getElementById("apiForm");

const savedApisBox =
  document.getElementById("savedApis");

const apiRunner =
  document.getElementById("apiRunner");

const apiRunnerInput =
  document.getElementById("apiRunnerInput");

const apiRunButton =
  document.getElementById("apiRunButton");

const apiRunnerResult =
  document.getElementById("apiRunnerResult");

function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

tools.forEach(button => {

  button.addEventListener(
    "click",
    () => {

      tools.forEach(x =>
        x.classList.remove("active")
      );

      button.classList.add("active");

      selectedType =
        button.dataset.type || "auto";

      if (selectedType === "custom") {

        customApiPanel.style.display =
          "block";

        searchInput.placeholder =
          "Select a saved API below...";

      } else {

        customApiPanel.style.display =
          "none";

        const placeholders = {

          auto:
            "Enter mobile, email, IP, PIN, IFSC, UPI, URL...",

          mobile:
            "Enter mobile number...",

          email:
            "Enter email address...",

          vehicle:
            "Enter vehicle registration number...",

          ip:
            "Enter IP address...",

          url:
            "Enter URL or domain...",

          pin:
            "Enter 6 digit PIN code...",

          ifsc:
            "Enter IFSC code...",

          upi:
            "Enter UPI ID...",

          company:
            "Enter company information...",

          crm:
            "Enter CRM search value..."
        };

        searchInput.placeholder =
          placeholders[selectedType] ||
          placeholders.auto;
      }

    }
  );

});

async function performLookup() {

  const value =
    searchInput.value.trim();

  if (!value) {

    resultBox.innerHTML = `
      <div class="error">
        Value is required
      </div>
    `;

    return;
  }

  resultBox.innerHTML = `
    <div class="loading">
      Searching...
    </div>
  `;

  try {

    const params =
      new URLSearchParams();

    /*
      Send ALL supported parameter names.

      This keeps compatibility with
      both old and new frontend/backend code.
    */

    params.set("value", value);
    params.set("query", value);
    params.set("q", value);
    params.set("input", value);

    if (
      selectedType &&
      selectedType !== "auto"
    ) {
      params.set(
        "type",
        selectedType
      );
    }

    const response =
      await fetch(
        `/api/lookup?${params.toString()}`,
        {
          method: "GET",
          headers: {
            "Accept":
              "application/json"
          }
        }
      );

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data?.error ||
        "Lookup failed"
      );
    }

    if (data.success === false) {
      throw new Error(
        data.error ||
        "Lookup failed"
      );
    }

    resultBox.innerHTML = `

      <div class="result-card">

        <div class="result-head">

          <strong>
            ${escapeHtml(
              data.type || "Result"
            )}
          </strong>

          <span>
            ${Number(
              data.result_count || 0
            )} result(s)
          </span>

        </div>

        <pre>${escapeHtml(
          JSON.stringify(
            data.results ??
            data.result ??
            data,
            null,
            2
          )
        )}</pre>

      </div>

    `;

  } catch (error) {

    resultBox.innerHTML = `
      <div class="error">
        ${escapeHtml(
          error.message ||
          "Something went wrong"
        )}
      </div>
    `;
  }
}

searchButton.addEventListener(
  "click",
  performLookup
);

searchInput.addEventListener(
  "keydown",
  event => {

    if (event.key === "Enter") {
      event.preventDefault();
      performLookup();
    }

  }
);

async function loadSavedApis() {

  savedApisBox.innerHTML = `
    <div class="loading">
      Loading saved APIs...
    </div>
  `;

  try {

    const response =
      await fetch(
        "/api/custom-apis",
        {
          method: "GET",
          headers: {
            "Accept":
              "application/json"
          }
        }
      );

    const data =
      await response.json();

    if (!response.ok ||
        data.success === false) {

      throw new Error(
        data.error ||
        "Failed to load APIs"
      );
    }

    const apis =
      Array.isArray(data.apis)
        ? data.apis
        : [];

    if (!apis.length) {

      savedApisBox.innerHTML = `
        <div class="empty">
          No saved APIs yet.
        </div>
      `;

      return;
    }

    savedApisBox.innerHTML =
      apis.map(api => `

        <div
          class="saved-api"
          data-id="${escapeHtml(api.id)}"
        >

          <div class="saved-api-top">

            <div>

              <div class="saved-api-name">
                ${escapeHtml(
                  api.name
                )}
              </div>

              <div class="saved-api-url">
                ${escapeHtml(
                  api.method
                )}
                ${escapeHtml(
                  api.url
                )}
              </div>

            </div>

          </div>

          ${
            api.description
              ? `
                <div
                  class="muted"
                  style="margin-top:8px;"
                >
                  ${escapeHtml(
                    api.description
                  )}
                </div>
              `
              : ""
          }

          <div class="api-actions">

            <button
              type="button"
              class="small-btn run-api"
              data-id="${escapeHtml(api.id)}"
            >
              Search
            </button>

            <button
              type="button"
              class="small-btn delete-btn delete-api"
              data-id="${escapeHtml(api.id)}"
            >
              Delete
            </button>

          </div>

        </div>

      `).join("");

    document
      .querySelectorAll(".run-api")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            selectedAPI =
              button.dataset.id;

            apiRunner.classList.add(
              "show"
            );

            apiRunnerInput.focus();

          }
        );

      });

    document
      .querySelectorAll(".delete-api")
      .forEach(button => {

        button.addEventListener(
          "click",
          async () => {

            await deleteAPI(
              button.dataset.id
            );

          }
        );

      });

  } catch (error) {

    savedApisBox.innerHTML = `
      <div class="error">
        ${escapeHtml(
          error.message ||
          "Failed to load APIs"
        )}
      </div>
    `;
  }
}

apiForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    const name =
      document
        .getElementById("apiName")
        .value.trim();

    const url =
      document
        .getElementById("apiUrl")
        .value.trim();

    const method =
      document
        .getElementById("apiMethod")
        .value;

    const description =
      document
        .getElementById("apiDescription")
        .value.trim();

    if (!name || !url) {
      return;
    }

    try {

      const response =
        await fetch(
          "/api/custom-apis",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json",
              "Accept":
                "application/json"
            },

            body: JSON.stringify({
              name,
              url,
              method,
              description
            })
          }
        );

      const data =
        await response.json();

      if (!response.ok ||
          data.success === false) {

        throw new Error(
          data.error ||
          "Failed to add API"
        );
      }

      apiForm.reset();

      await loadSavedApis();

    } catch (error) {

      savedApisBox.innerHTML = `
        <div class="error">
          ${escapeHtml(
            error.message ||
            "Failed to add API"
          )}
        </div>
      `;
    }

  }
);

async function deleteAPI(id) {

  if (!id) {
    return;
  }

  try {

    const response =
      await fetch(
        `/api/custom-apis?id=${encodeURIComponent(id)}`,
        {
          method: "DELETE",
          headers: {
            "Accept":
              "application/json"
          }
        }
      );

    const data =
      await response.json();

    if (!response.ok ||
        data.success === false) {

      throw new Error(
        data.error ||
        "Delete failed"
      );
    }

    if (
      selectedAPI &&
      String(selectedAPI) === String(id)
    ) {

      selectedAPI = null;

      apiRunner.classList.remove(
        "show"
      );

    }

    await loadSavedApis();

  } catch (error) {

    savedApisBox.innerHTML = `
      <div class="error">
        ${escapeHtml(
          error.message ||
          "Delete failed"
        )}
      </div>
    `;
  }
}

apiRunButton.addEventListener(
  "click",
  async () => {

    if (!selectedAPI) {

      apiRunnerResult.innerHTML = `
        <div class="error">
          Select a saved API first.
        </div>
      `;

      return;
    }

    const value =
      apiRunnerInput.value.trim();

    if (!value) {

      apiRunnerResult.innerHTML = `
        <div class="error">
          Value is required
        </div>
      `;

      return;
    }

    apiRunnerResult.innerHTML = `
      <div class="loading">
        Running API...
      </div>
    `;

    try {

      const response =
        await fetch(
          `/api/custom-proxy?id=${encodeURIComponent(
            selectedAPI
          )}&message=${encodeURIComponent(
            value
          )}`,
          {
            method: "GET",
            headers: {
              "Accept":
                "application/json"
            }
          }
        );

      const data =
        await response.json();

      if (!response.ok ||
          data.success === false) {

        throw new Error(
          data.error ||
          "API request failed"
        );
      }

      apiRunnerResult.innerHTML = `

        <div class="result-card">

          <div class="result-head">

            <strong>
              API Response
            </strong>

          </div>

          <pre>${escapeHtml(
            JSON.stringify(
              data.response ??
              data,
              null,
              2
            )
          )}</pre>

        </div>

      `;

    } catch (error) {

      apiRunnerResult.innerHTML = `
        <div class="error">
          ${escapeHtml(
            error.message ||
            "API request failed"
          )}
        </div>
      `;
    }

  }
);

loadSavedApis();

</script>

</body>
</html>
