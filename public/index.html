<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>TXG Information Center</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: #020817;
  color: #e8f3ff;
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

body {
  overflow-x: hidden;
}

/* ======================================
   CODE BACKGROUND
====================================== */

#codeBg {
  position: fixed;
  inset: 0;
  overflow: hidden;
  z-index: 0;
  pointer-events: none;

  background:
    radial-gradient(
      circle at 50% 20%,
      rgba(0,120,255,.20),
      transparent 45%
    ),
    #020817;
}

.codeLine {
  position: absolute;
  white-space: nowrap;

  font-family:
    "Courier New",
    monospace;

  font-size: 12px;

  color:
    rgba(70,170,255,.48);

  text-shadow:
    0 0 8px
    rgba(0,130,255,.7);

  animation:
    codeMove linear forwards;
}

@keyframes codeMove {
  0% {
    transform:
      translateY(110vh);
    opacity: 0;
  }

  10% {
    opacity: 1;
  }

  90% {
    opacity: 1;
  }

  100% {
    transform:
      translateY(-120px);
    opacity: 0;
  }
}

/* ======================================
   LOGIN
====================================== */

#loginScreen {
  position: relative;
  z-index: 10;

  min-height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 20px;
}

.loginBox {
  width: 100%;
  max-width: 390px;

  padding: 30px;

  border:
    1px solid
    rgba(50,150,255,.30);

  border-radius: 24px;

  background:
    rgba(3,15,35,.88);

  backdrop-filter:
    blur(18px);

  box-shadow:
    0 0 50px
    rgba(0,100,255,.20);
}

.logo {
  text-align: center;
  font-size: 28px;
  font-weight: 900;
  letter-spacing: 1px;

  color: #55b8ff;

  text-shadow:
    0 0 20px
    rgba(0,150,255,.8);
}

.sub {
  text-align: center;
  color: #7691ad;
  margin: 8px 0 25px;
  font-size: 13px;
}

input {
  width: 100%;

  border: 1px solid
    rgba(80,150,220,.28);

  outline: none;

  background:
    rgba(0,10,25,.75);

  color: white;

  border-radius: 13px;

  padding: 14px;

  font-size: 16px;
}

input:focus {
  border-color:
    #269cff;

  box-shadow:
    0 0 0 3px
    rgba(38,156,255,.10);
}

button {
  border: 0;
  cursor: pointer;

  border-radius: 13px;

  padding: 13px 16px;

  font-weight: 700;

  color: white;

  background:
    linear-gradient(
      135deg,
      #087cff,
      #0051c9
    );

  box-shadow:
    0 0 20px
    rgba(0,110,255,.18);
}

button:hover {
  filter: brightness(1.12);
}

.full {
  width: 100%;
  margin-top: 12px;
}

.error {
  color: #ff7070;
  font-size: 13px;
  margin-top: 12px;
  text-align: center;
}

/* ======================================
   DASHBOARD
====================================== */

#dashboard {
  display: none;

  position: relative;
  z-index: 2;

  min-height: 100vh;

  padding: 22px;
}

.dashboardWrap {
  width: 100%;
  max-width: 1100px;
  margin: auto;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;

  gap: 15px;

  margin-bottom: 20px;
}

.brand {
  font-size: 25px;
  font-weight: 900;

  color: #5bbaff;

  text-shadow:
    0 0 18px
    rgba(0,150,255,.65);
}

.headerActions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.smallBtn {
  padding: 10px 13px;
  font-size: 13px;
}

/* ======================================
   MAIN PANEL
====================================== */

.panel {
  border:
    1px solid
    rgba(70,160,255,.25);

  background:
    rgba(3,15,35,.78);

  backdrop-filter:
    blur(15px);

  border-radius: 22px;

  padding: 20px;

  box-shadow:
    0 0 40px
    rgba(0,90,255,.12);
}

.title {
  font-size: 18px;
  font-weight: 800;
  margin-bottom: 15px;
}

.searchRow {
  display: flex;
  gap: 10px;
}

.searchRow input {
  flex: 1;
}

.tools {
  display: grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(135px, 1fr)
    );

  gap: 10px;

  margin-top: 18px;
}

.tool {
  padding: 15px 10px;

  background:
    rgba(5,25,55,.82);

  border:
    1px solid
    rgba(65,145,230,.20);

  color: #b8d9f8;
}

.tool.active {
  border-color:
    #168fff;

  background:
    rgba(0,100,220,.20);

  color: white;

  box-shadow:
    0 0 18px
    rgba(0,120,255,.18);
}

/* ======================================
   RESPONSE
====================================== */

#status {
  margin-top: 14px;

  color: #73bfff;

  font-size: 13px;
}

#response {
  margin-top: 15px;

  min-height: 180px;

  max-height: 500px;

  overflow: auto;

  padding: 17px;

  border-radius: 15px;

  background:
    rgba(0,5,15,.82);

  border:
    1px solid
    rgba(80,150,220,.18);

  font-family:
    "Courier New",
    monospace;

  font-size: 13px;

  line-height: 1.6;

  white-space: pre-wrap;

  word-break: break-word;

  color: #a9d8ff;
}

/* ======================================
   CUSTOM API
====================================== */

.customSection {
  margin-top: 20px;
}

.customForm {
  display: grid;

  grid-template-columns:
    1fr 2fr auto;

  gap: 8px;
}

.customList {
  display: flex;

  flex-wrap: wrap;

  gap: 8px;

  margin-top: 12px;
}

.customApi {
  background:
    rgba(0,90,190,.20);

  border:
    1px solid
    rgba(50,140,240,.28);

  color: #9fd4ff;
}

/* ======================================
   MODAL
====================================== */

.modal {
  display: none;

  position: fixed;
  inset: 0;

  z-index: 50;

  background:
    rgba(0,5,15,.72);

  backdrop-filter:
    blur(7px);

  align-items: center;
  justify-content: center;

  padding: 20px;
}

.modalBox {
  width: 100%;
  max-width: 420px;

  background:
    #041225;

  border:
    1px solid
    rgba(60,150,255,.30);

  border-radius: 20px;

  padding: 23px;
}

.modalTitle {
  font-size: 19px;
  font-weight: 800;
  margin-bottom: 15px;
}

.modalButtons {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.secondary {
  background:
    rgba(50,90,130,.30);
}

/* ======================================
   MOBILE
====================================== */

@media(max-width:650px) {

  #dashboard {
    padding: 12px;
  }

  .header {
    align-items: flex-start;
    flex-direction: column;
  }

  .searchRow {
    flex-direction: column;
  }

  .customForm {
    grid-template-columns: 1fr;
  }

  .tools {
    grid-template-columns:
      repeat(2, 1fr);
  }

  .panel {
    padding: 14px;
  }
}
</style>
</head>

<body>

<div id="codeBg"></div>

<!-- =====================================
     LOGIN
===================================== -->

<section id="loginScreen">

  <div class="loginBox">

    <div class="logo">
      TXG
    </div>

    <div class="sub">
      INFORMATION CENTER
    </div>

    <input
      id="loginPassword"
      type="password"
      placeholder="Enter password"
      autocomplete="current-password"
    >

    <button
      id="loginBtn"
      class="full"
    >
      Login
    </button>

    <div
      id="loginError"
      class="error"
    ></div>

  </div>

</section>

<!-- =====================================
     DASHBOARD
===================================== -->

<section id="dashboard">

  <div class="dashboardWrap">

    <div class="header">

      <div class="brand">
        TXG INFORMATION
      </div>

      <div class="headerActions">

        <button
          class="smallBtn"
          id="changePasswordBtn"
        >
          Change Password
        </button>

        <button
          class="smallBtn"
          id="logoutBtn"
        >
          Logout
        </button>

      </div>

    </div>

    <div class="panel">

      <div class="title">
        Lookup Center
      </div>

      <div class="searchRow">

        <input
          id="lookupInput"
          placeholder="Enter value..."
          autocomplete="off"
        >

        <button id="searchBtn">
          Search
        </button>

      </div>

      <div
        id="status"
      >
        Select a lookup type.
      </div>

      <div class="tools">

        <button
          class="tool active"
          data-type="mobile"
        >
          📱 Mobile
        </button>

        <button
          class="tool"
          data-type="pin"
        >
          📍 PIN
        </button>

        <button
          class="tool"
          data-type="ifsc"
        >
          🏦 IFSC
        </button>

        <button
          class="tool"
          data-type="ip"
        >
          🌐 IP
        </button>

        <button
          class="tool"
          data-type="url"
        >
          🔗 URL
        </button>

        <button
          class="tool"
          data-type="upi"
        >
          💳 UPI
        </button>

      </div>

      <pre id="response">
Ready...
      </pre>

      <!-- CUSTOM API -->

      <div class="customSection">

        <div class="title">
          Custom APIs
        </div>

        <div class="customForm">

          <input
            id="apiName"
            placeholder="Button name"
          >

          <input
            id="apiUrl"
            placeholder="https://example.com/?message={message}"
          >

          <button id="addApiBtn">
            Add API
          </button>

        </div>

        <div
          id="customList"
          class="customList"
        ></div>

      </div>

    </div>

  </div>

</section>

<!-- =====================================
     CHANGE PASSWORD MODAL
===================================== -->

<div
  id="passwordModal"
  class="modal"
>

  <div class="modalBox">

    <div class="modalTitle">
      Change Password
    </div>

    <input
      id="oldPassword"
      type="password"
      placeholder="Current password"
    >

    <br><br>

    <input
      id="newPassword"
      type="password"
      placeholder="New password"
    >

    <div class="modalButtons">

      <button id="savePasswordBtn">
        Save Password
      </button>

      <button
        id="closePasswordBtn"
        class="secondary"
      >
        Cancel
      </button>

    </div>

    <div
      id="passwordMessage"
      class="error"
    ></div>

  </div>

</div>

<script>
/* =====================================
   BLUE FAKE CODE
===================================== */

(function () {

  const bg =
    document.getElementById(
      "codeBg"
    );

  const codes = [
    "const TXG = initialize();",
    "API_STATUS: CONNECTED",
    "fetch('/api/lookup')",
    "response.status === 200",
    "VERIFYING_REQUEST...",
    "UPI_VALIDATION: READY",
    "IFSC_DATABASE: ONLINE",
    "MOBILE_LOOKUP: ACTIVE",
    "PIN_SERVICE: CONNECTED",
    "IP_LOOKUP: RUNNING",
    "CUSTOM_API: READY",
    "SECURE_SESSION: TRUE",
    "AUTHENTICATION: OK",
    "request_id: TXG_2026",
    "await response.json();",
    "HTTP 200 OK",
    "SYSTEM_STATUS: ONLINE",
    "ENCRYPTION: ACTIVE",
    "DATABASE: CONNECTED",
    "TXG_INFORMATION_CENTER",
    "lookup.process(input);",
    "server.response();",
    "session.verify();",
    "UPI.handle.validate();",
    "IFSC.branch.lookup();"
  ];

  function createLine() {

    const line =
      document.createElement(
        "div"
      );

    line.className =
      "codeLine";

    line.textContent =
      codes[
        Math.floor(
          Math.random() *
          codes.length
        )
      ];

    line.style.left =
      Math.random() * 95 + "%";

    line.style.animationDuration =
      7 + Math.random() * 10 + "s";

    line.style.animationDelay =
      Math.random() * 2 + "s";

    line.style.fontSize =
      10 + Math.random() * 4 + "px";

    bg.appendChild(line);

    setTimeout(
      () => line.remove(),
      19000
    );
  }

  for (
    let i = 0;
    i < 30;
    i++
  ) {
    createLine();
  }

  setInterval(
    createLine,
    500
  );

})();

/* =====================================
   VARIABLES
===================================== */

let currentType =
  "mobile";

let selectedCustomApi =
  null;

/* =====================================
   ELEMENTS
===================================== */

const loginScreen =
  document.getElementById(
    "loginScreen"
  );

const dashboard =
  document.getElementById(
    "dashboard"
  );

const loginPassword =
  document.getElementById(
    "loginPassword"
  );

const loginBtn =
  document.getElementById(
    "loginBtn"
  );

const loginError =
  document.getElementById(
    "loginError"
  );

const lookupInput =
  document.getElementById(
    "lookupInput"
  );

const searchBtn =
  document.getElementById(
    "searchBtn"
  );

const responseBox =
  document.getElementById(
    "response"
  );

const statusBox =
  document.getElementById(
    "status"
  );

const customList =
  document.getElementById(
    "customList"
  );

/* =====================================
   AUTH
===================================== */

async function auth(action, data = {}) {

  const response =
    await fetch(
      "/api/auth",
      {
        method: "POST",
        headers: {
          "Content-Type":
            "application/json"
        },
        body: JSON.stringify({
          action,
          ...data
        })
      }
    );

  return response.json();
}

async function checkLogin() {

  try {

    const result =
      await auth("status");

    if (
      result.ok &&
      result.loggedIn
    ) {
      showDashboard();
    } else {
      showLogin();
    }

  } catch (_) {
    showLogin();
  }
}

function showLogin() {

  loginScreen.style.display =
    "flex";

  dashboard.style.display =
    "none";
}

function showDashboard() {

  loginScreen.style.display =
    "none";

  dashboard.style.display =
    "block";
}

/* =====================================
   LOGIN
===================================== */

loginBtn.addEventListener(
  "click",
  async () => {

    loginError.textContent =
      "Checking...";

    const password =
      loginPassword.value;

    if (!password) {
      loginError.textContent =
        "Enter password";
      return;
    }

    try {

      const result =
        await auth(
          "login",
          { password }
        );

      if (result.ok) {

        loginPassword.value =
          "";

        loginError.textContent =
          "";

        showDashboard();

      } else {

        loginError.textContent =
          result.message ||
          "Login failed";
      }

    } catch (_) {

      loginError.textContent =
        "Server error";
    }
  }
);

loginPassword.addEventListener(
  "keydown",
  e => {

    if (
      e.key === "Enter"
    ) {
      loginBtn.click();
    }

  }
);

/* =====================================
   LOGOUT
===================================== */

document
  .getElementById(
    "logoutBtn"
  )
  .addEventListener(
    "click",
    async () => {

      await auth("logout");

      showLogin();

    }
  );

/* =====================================
   CHANGE PASSWORD
===================================== */

const passwordModal =
  document.getElementById(
    "passwordModal"
  );

document
  .getElementById(
    "changePasswordBtn"
  )
  .addEventListener(
    "click",
    () => {

      passwordModal.style.display =
        "flex";

      document
        .getElementById(
          "passwordMessage"
        )
        .textContent = "";

    }
  );

document
  .getElementById(
    "closePasswordBtn"
  )
  .addEventListener(
    "click",
    () => {

      passwordModal.style.display =
        "none";

    }
  );

document
  .getElementById(
    "savePasswordBtn"
  )
  .addEventListener(
    "click",
    async () => {

      const oldPassword =
        document.getElementById(
          "oldPassword"
        ).value;

      const newPassword =
        document.getElementById(
          "newPassword"
        ).value;

      const message =
        document.getElementById(
          "passwordMessage"
        );

      if (
        !oldPassword ||
        !newPassword
      ) {
        message.textContent =
          "Fill both passwords";
        return;
      }

      try {

        const result =
          await auth(
            "change-password",
            {
              oldPassword,
              newPassword
            }
          );

        if (result.ok) {

          message.style.color =
            "#61d5ff";

          message.textContent =
            "Password changed. Login again.";

          setTimeout(
            () => {

              passwordModal.style.display =
                "none";

              showLogin();

            },
            1200
          );

        } else {

          message.style.color =
            "#ff7070";

          message.textContent =
            result.message ||
            "Password change failed";
        }

      } catch (_) {

        message.textContent =
          "Server error";
      }

    }
  );

/* =====================================
   LOOKUP TYPE
===================================== */

document
  .querySelectorAll(
    ".tool"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(
              ".tool"
            )
            .forEach(
              x =>
                x.classList.remove(
                  "active"
                )
            );

          button.classList.add(
            "active"
          );

          selectedCustomApi =
            null;

          currentType =
            button.dataset.type;

          statusBox.textContent =
            "Selected: " +
            currentType.toUpperCase();

          lookupInput.placeholder =
            getPlaceholder(
              currentType
            );
        }
      );

    }
  );

function getPlaceholder(type) {

  const map = {
    mobile:
      "Enter mobile number...",
    pin:
      "Enter 6 digit PIN...",
    ifsc:
      "Enter IFSC...",
    ip:
      "Enter IP address...",
    url:
      "Enter URL...",
    upi:
      "Enter UPI ID..."
  };

  return (
    map[type] ||
    "Enter value..."
  );
}

/* =====================================
   BUILT-IN LOOKUP
===================================== */

async function runLookup() {

  const value =
    lookupInput.value.trim();

  if (!value) {

    statusBox.textContent =
      "Enter a value first.";

    return;
  }

  if (selectedCustomApi) {

    await runCustomApi(
      selectedCustomApi,
      value
    );

    return;
  }

  statusBox.textContent =
    "Running " +
    currentType.toUpperCase() +
    " lookup...";

  responseBox.textContent =
    "Processing...";

  try {

    const response =
      await fetch(
        "/api/lookup",
        {
          method: "POST",
          headers: {
            "Content-Type":
              "application/json"
          },
          body:
            JSON.stringify({
              type:
                currentType,
              value
            })
        }
      );

    const data =
      await response.json();

    responseBox.textContent =
      JSON.stringify(
        data,
        null,
        2
      );

    statusBox.textContent =
      data.ok
        ? "Lookup completed."
        : (
          data.message ||
          "Lookup failed."
        );

  } catch (error) {

    responseBox.textContent =
      error.message;

    statusBox.textContent =
      "Request failed.";
  }
}

searchBtn.addEventListener(
  "click",
  runLookup
);

lookupInput.addEventListener(
  "keydown",
  e => {

    if (
      e.key === "Enter"
    ) {
      runLookup();
    }

  }
);

/* =====================================
   CUSTOM APIs
===================================== */

function getCustomApis() {

  try {

    return JSON.parse(
      localStorage.getItem(
        "txg_custom_apis"
      ) || "[]"
    );

  } catch (_) {

    return [];
  }
}

function saveCustomApis(apis) {

  localStorage.setItem(
    "txg_custom_apis",
    JSON.stringify(apis)
  );

}

function renderCustomApis() {

  customList.innerHTML =
    "";

  const apis =
    getCustomApis();

  apis.forEach(
    (api, index) => {

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "customApi";

      button.textContent =
        api.name;

      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(
              ".tool"
            )
            .forEach(
              x =>
                x.classList.remove(
                  "active"
                )
            );

          selectedCustomApi =
            api;

          statusBox.textContent =
            "Custom API selected: " +
            api.name;

          lookupInput.placeholder =
            "Enter value for " +
            api.name +
            "...";

        }
      );

      customList.appendChild(
        button
      );

    }
  );
}

document
  .getElementById(
    "addApiBtn"
  )
  .addEventListener(
    "click",
    () => {

      const name =
        document
          .getElementById(
            "apiName"
          )
          .value
          .trim();

      const url =
        document
          .getElementById(
            "apiUrl"
          )
          .value
          .trim();

      if (!name) {
        alert(
          "Enter API button name"
        );
        return;
      }

      if (
        !url.startsWith(
          "https://"
        )
      ) {
        alert(
          "Only HTTPS APIs are allowed"
        );
        return;
      }

      if (
        !url
          .toLowerCase()
          .includes(
            "{message}"
          )
      ) {
        alert(
          "API URL must contain {message}"
        );
        return;
      }

      const apis =
        getCustomApis();

      apis.push({
        name,
        url
      });

      saveCustomApis(
        apis
      );

      document
        .getElementById(
          "apiName"
        )
        .value = "";

      document
        .getElementById(
          "apiUrl"
        )
        .value = "";

      renderCustomApis();

      statusBox.textContent =
        "Custom API added.";
    }
  );

/* =====================================
   CUSTOM API RUNNER
===================================== */

async function runCustomApi(
  api,
  message
) {

  statusBox.textContent =
    "Running " +
    api.name +
    "...";

  responseBox.textContent =
    "Processing...";

  try {

    const response =
      await fetch(
        "/api/custom",
        {
          method: "POST",
          headers: {
            "Content-Type":
              "application/json"
          },
          body:
            JSON.stringify({
              url:
                api.url,
              message
            })
        }
      );

    const data =
      await response.json();

    responseBox.textContent =
      JSON.stringify(
        data,
        null,
        2
      );

    statusBox.textContent =
      data.ok
        ? "Custom API completed."
        : (
          data.message ||
          "Custom API failed."
        );

  } catch (error) {

    responseBox.textContent =
      error.message;

    statusBox.textContent =
      "Custom API request failed.";
  }
}

/* =====================================
   START
===================================== */

renderCustomApis();

lookupInput.placeholder =
  getPlaceholder(
    currentType
  );

checkLogin();

</script>
