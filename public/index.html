<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TXG Information</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#080b12;
    color:#f5f7fb;
    font-family:Inter,Arial,sans-serif;
}

.app{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:22px 16px 50px;
}

.header{
    text-align:center;
    margin-bottom:24px;
}

.logo{
    font-size:30px;
    font-weight:900;
    letter-spacing:-1px;
}

.logo span{
    color:#00d99a;
}

.subtitle{
    color:#8992a5;
    font-size:14px;
    margin-top:7px;
}

.search-box{
    background:#10151f;
    border:1px solid #202838;
    border-radius:20px;
    padding:18px;
    margin-bottom:20px;
}

.search-row{
    display:flex;
    gap:10px;
}

#value{
    flex:1;
    min-width:0;
    background:#080b12;
    color:#fff;
    border:1px solid #293243;
    border-radius:13px;
    padding:14px 15px;
    outline:none;
    font-size:15px;
}

#value:focus{
    border-color:#00d99a;
}

#searchBtn{
    border:0;
    border-radius:13px;
    padding:0 22px;
    background:#00d99a;
    color:#06100c;
    font-weight:900;
    cursor:pointer;
}

#searchBtn:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.categories{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:9px;
    margin-top:14px;
}

.category{
    border:1px solid #252d3d;
    background:#0b1018;
    color:#cbd2df;
    border-radius:11px;
    padding:10px 7px;
    font-size:12px;
    font-weight:800;
    cursor:pointer;
}

.category.active{
    background:#00d99a;
    color:#06100c;
    border-color:#00d99a;
}

.status{
    display:none;
    text-align:center;
    padding:16px;
    color:#8e98aa;
}

.results{
    display:flex;
    flex-direction:column;
    gap:13px;
}

.result-card{
    background:#10151f;
    border:1px solid #202838;
    border-radius:18px;
    overflow:hidden;
}

.result-head{
    padding:14px 16px;
    border-bottom:1px solid #202838;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.result-name{
    font-size:15px;
    font-weight:900;
}

.result-source{
    font-size:11px;
    color:#00d99a;
    background:#06271d;
    border:1px solid #0a4b39;
    padding:5px 8px;
    border-radius:7px;
}

.result-body{
    padding:15px 16px;
}

.result-row{
    display:flex;
    justify-content:space-between;
    gap:18px;
    padding:9px 0;
    border-bottom:1px solid #1c2330;
}

.result-row:last-child{
    border-bottom:0;
}

.result-key{
    color:#8992a5;
    font-size:12px;
    flex:0 0 38%;
}

.result-value{
    color:#f1f4f8;
    font-size:13px;
    text-align:right;
    word-break:break-word;
}

.raw-response{
    margin:0;
    white-space:pre-wrap;
    word-break:break-word;
    color:#cbd2df;
    font-size:12px;
    line-height:1.6;
    background:#080b12;
    border-radius:11px;
    padding:13px;
    overflow:auto;
}

.empty{
    text-align:center;
    padding:45px 20px;
    color:#687286;
}

.error{
    color:#ff7c88;
}

@media(max-width:750px){
    .categories{
        grid-template-columns:repeat(3,1fr);
    }

    .search-row{
        flex-direction:column;
    }

    #searchBtn{
        min-height:46px;
    }
}

@media(max-width:420px){
    .categories{
        grid-template-columns:repeat(2,1fr);
    }

    .result-row{
        flex-direction:column;
        gap:4px;
    }

    .result-value{
        text-align:left;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="logo">TXG <span>Information</span></div>
        <div class="subtitle">
            Connected Information Lookup Center
        </div>
    </div>

    <div class="search-box">

        <div class="search-row">
            <input
                id="value"
                type="text"
                autocomplete="off"
                placeholder="Enter number, email, IP, URL..."
            >

            <button id="searchBtn" type="button">
                Search
            </button>
        </div>

        <div class="categories">

            <button class="category active" data-type="mobile">
                Mobile
            </button>

            <button class="category" data-type="email">
                Email
            </button>

            <button class="category" data-type="vehicle">
                Vehicle
            </button>

            <button class="category" data-type="ip">
                IP
            </button>

            <button class="category" data-type="url">
                URL
            </button>

            <button class="category" data-type="pin">
                PIN
            </button>

            <button class="category" data-type="ifsc">
                IFSC
            </button>

            <button class="category" data-type="upi">
                UPI
            </button>

            <button class="category" data-type="company">
                Company
            </button>

            <button class="category" data-type="crm">
                CRM
            </button>

            <button class="category" data-type="custom">
                Custom API
            </button>

        </div>

    </div>

    <div id="status" class="status">
        Searching...
    </div>

    <div id="results" class="results">

        <div class="empty">
            Search something to see connected information.
        </div>

    </div>

</div>

<script>

let selectedType = "mobile";

const valueInput = document.getElementById("value");
const searchBtn = document.getElementById("searchBtn");
const results = document.getElementById("results");
const statusBox = document.getElementById("status");
const categoryButtons = document.querySelectorAll(".category");


categoryButtons.forEach(button => {

    button.addEventListener("click", () => {

        categoryButtons.forEach(btn => {
            btn.classList.remove("active");
        });

        button.classList.add("active");

        selectedType = button.dataset.type;

        const placeholders = {
            mobile: "Enter mobile number...",
            email: "Enter email address...",
            vehicle: "Enter vehicle registration number...",
            ip: "Enter IP address...",
            url: "Enter URL or domain...",
            pin: "Enter PIN code...",
            ifsc: "Enter IFSC code...",
            upi: "Enter UPI ID...",
            company: "Enter company name...",
            crm: "Enter CRM search...",
            custom: "Enter search value..."
        };

        valueInput.placeholder =
            placeholders[selectedType] ||
            "Enter search value...";

    });

});


searchBtn.addEventListener("click", runSearch);


valueInput.addEventListener("keydown", event => {

    if(event.key === "Enter"){
        runSearch();
    }

});


async function runSearch(){

    const value = valueInput.value.trim();

    if(!value){
        results.innerHTML = `
            <div class="empty error">
                Please enter a value to search.
            </div>
        `;
        return;
    }

    searchBtn.disabled = true;

    statusBox.style.display = "block";
    statusBox.textContent = "Searching connected sources...";

    results.innerHTML = "";

    try{

        const url =
            "/api/lookup?type=" +
            encodeURIComponent(selectedType) +
            "&value=" +
            encodeURIComponent(value);

        const response = await fetch(url, {
            method:"GET",
            headers:{
                "Accept":"application/json"
            },
            cache:"no-store"
        });

        const data = await response.json();

        if(!response.ok){

            throw new Error(
                data.message ||
                "Search request failed."
            );

        }

        renderResults(data);

    }catch(error){

        results.innerHTML = `
            <div class="result-card">
                <div class="result-head">
                    <div class="result-name">Search Error</div>
                    <div class="result-source">ERROR</div>
                </div>

                <div class="result-body">
                    <div class="raw-response error">
                        ${escapeHtml(error.message || "Unknown error")}
                    </div>
                </div>
            </div>
        `;

    }finally{

        searchBtn.disabled = false;
        statusBox.style.display = "none";

    }

}


function renderResults(data){

    results.innerHTML = "";

    /*
        Backend can return:

        {
            "results":[
                {
                    "name":"CRM",
                    "source":"Zoho CRM",
                    "data":{...}
                },
                {
                    "name":"Company",
                    "source":"Company API",
                    "data":{...}
                }
            ]
        }

        Every result becomes its own block.
    */

    let items = [];

    if(Array.isArray(data)){
        items = data;
    }else if(Array.isArray(data.results)){
        items = data.results;
    }else if(Array.isArray(data.sources)){
        items = data.sources;
    }else{

        items = [{
            name:data.name || "Response",
            source:data.source || "TXG",
            data:data
        }];

    }


    if(!items.length){

        results.innerHTML = `
            <div class="empty">
                No information found.
            </div>
        `;

        return;
    }


    items.forEach(item => {

        const card = document.createElement("div");

        card.className = "result-card";

        const name =
            item.name ||
            item.title ||
            item.type ||
            "Information";

        const source =
            item.source ||
            item.provider ||
            "TXG";


        const body =
            item.data !== undefined
                ? item.data
                : item.response !== undefined
                    ? item.response
                    : item;


        card.innerHTML = `
            <div class="result-head">

                <div class="result-name">
                    ${escapeHtml(String(name))}
                </div>

                <div class="result-source">
                    ${escapeHtml(String(source))}
                </div>

            </div>

            <div class="result-body">
                ${renderBody(body)}
            </div>
        `;


        results.appendChild(card);

    });

}


function renderBody(data){

    if(
        data === null ||
        data === undefined
    ){
        return `
            <div class="raw-response">
                Not available
            </div>
        `;
    }


    if(
        typeof data !== "object"
    ){
        return `
            <div class="raw-response">
                ${escapeHtml(String(data))}
            </div>
        `;
    }


    const entries = Object.entries(data);

    if(!entries.length){

        return `
            <div class="raw-response">
                No data returned.
            </div>
        `;

    }


    let html = "";

    entries.forEach(([key,value]) => {

        if(
            value !== null &&
            typeof value === "object"
        ){

            html += `
                <div class="result-row">

                    <div class="result-key">
                        ${escapeHtml(formatKey(key))}
                    </div>

                    <div class="result-value">
                        ${escapeHtml(
                            JSON.stringify(value,null,2)
                        )}
                    </div>

                </div>
            `;

        }else{

            html += `
                <div class="result-row">

                    <div class="result-key">
                        ${escapeHtml(formatKey(key))}
                    </div>

                    <div class="result-value">
                        ${escapeHtml(
                            value === null
                                ? "Not available"
                                : String(value)
                        )}
                    </div>

                </div>
            `;

        }

    });


    return html;

}


function formatKey(key){

    return String(key)
        .replace(/_/g," ")
        .replace(/([a-z])([A-Z])/g,"$1 $2")
        .replace(/\b\w/g,c => c.toUpperCase());

}


function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
