<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>TXG Information Center</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, Arial, sans-serif;
      background: #07090d;
      color: #f5f7fa;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 10%, rgba(50,80,130,.12), transparent 30%),
        radial-gradient(circle at 85% 90%, rgba(80,60,130,.10), transparent 30%),
        #07090d;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    .hidden {
      display: none !important;
    }

    .page {
      width: min(1100px, 94%);
      margin: auto;
      padding: 28px 0 50px;
    }

    /* LOGIN */

    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: min(430px, 100%);
      background: rgba(15,18,25,.96);
      border: 1px solid #202633;
      border-radius: 22px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    .logo {
      width: 58px;
      height: 58px;
      border-radius: 17px;
      display: grid;
      place-items: center;
      background: #151a24;
      border: 1px solid #293243;
      font-weight: 900;
      font-size: 19px;
      margin-bottom: 18px;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    .login-card h1 {
      font-size: 25px;
      margin-bottom: 8px;
    }

    .muted {
      color: #8f98a8;
      font-size: 14px;
    }

    .field {
      margin-top: 18px;
    }

    .field label {
      display: block;
      font-size: 13px;
      color: #aab2c0;
      margin-bottom: 8px;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #29303d;
      outline: none;
      background: #0c1017;
      color: #fff;
      border-radius: 12px;
      padding: 13px 14px;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #64748b;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    .btn {
      border: 0;
      border-radius: 12px;
      padding: 13px 16px;
      cursor: pointer;
      color: #fff;
      background: #202938;
      transition: .15s;
    }

    .btn:hover {
      filter: brightness(1.12);
    }

    .btn-primary {
      background: #2563eb;
    }

    .btn-danger {
      background: #8f2530;
    }

    .btn-success {
      background: #176b45;
    }

    .btn-full {
      width: 100%;
      margin-top: 20px;
    }

    .error {
      color: #ff8e98;
      font-size: 13px;
      margin-top: 12px;
    }

    /* HEADER */

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 24px;
    }

    .brand-title {
      font-size: 25px;
      font-weight: 800;
    }

    .brand-sub {
      color: #858e9d;
      font-size: 13px;
      margin-top: 4px;
    }

    .logout {
      white-space: nowrap;
    }

    /* SEARCH */

    .search-card {
      background: rgba(14,18,25,.95);
      border: 1px solid #202633;
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 20px;
    }

    .search-row {
      display: grid;
      grid-template-columns: 180px 1fr auto;
      gap: 10px;
    }

    /* TOOLS */

    .section-title {
      font-size: 15px;
      font-weight: 700;
      color: #cbd2dd;
      margin: 25px 0 12px;
    }

    .tools {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 10px;
    }

    .tool {
      min-height: 58px;
      text-align: left;
      background: #0f141c;
      border: 1px solid #222b38;
      border-radius: 15px;
      padding: 15px;
      color: #fff;
      cursor: pointer;
      font-weight: 700;
    }

    .tool:hover {
      border-color: #3b4658;
      background: #121923;
    }

    .tool small {
      display: block;
      color: #788293;
      font-weight: 400;
      margin-top: 4px;
      font-size: 11px;
    }

    /* CUSTOM APIs */

    .manager {
      background: rgba(14,18,25,.95);
      border: 1px solid #202633;
      border-radius: 20px;
      padding: 18px;
      margin-top: 20px;
    }

    .manager-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .manager-head h2 {
      margin: 0;
      font-size: 18px;
    }

    .api-list {
      display: grid;
      gap: 9px;
      margin-top: 14px;
    }

    .saved-api {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #0b0f15;
      border: 1px solid #202734;
      border-radius: 14px;
      padding: 12px;
    }

    .saved-api-info {
      min-width: 0;
    }

    .saved-api-name {
      font-weight: 700;
      word-break: break-word;
    }

    .saved-api-url {
      color: #788293;
      font-size: 11px;
      margin-top: 4px;
      word-break: break-all;
    }

    .remove-btn {
      flex: 0 0 auto;
      border: 1px solid #61242b;
      background: #281216;
      color: #ff9aa3;
      border-radius: 9px;
      padding: 8px 11px;
      cursor: pointer;
      font-size: 12px;
    }

    .remove-btn:hover {
      background: #42171d;
    }

    .empty {
      color: #70798a;
      text-align: center;
      padding: 18px 8px;
      font-size: 13px;
    }

    /* RESULT */

    .results {
      margin-top: 20px;
      display: grid;
      gap: 12px;
    }

    .result-card {
      background: #0e131b;
      border: 1px solid #202936;
      border-radius: 17px;
      padding: 16px;
    }

    .result-title {
      font-weight: 800;
      margin-bottom: 10px;
    }

    .result-status {
      color: #7dd3a8;
      font-size: 12px;
      margin-bottom: 10px;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0;
      color: #cbd5e1;
      font-size: 12px;
      line-height: 1.55;
    }

    .notice {
      margin-top: 12px;
      padding: 11px 13px;
      border-radius: 11px;
      background: #111722;
      border: 1px solid #222b38;
      color: #9ba5b5;
      font-size: 12px;
    }

    @media (max-width: 700px) {
      .page {
        width: 92%;
        padding-top: 20px;
      }

      .header {
        align-items: flex-start;
      }

      .search-row {
        grid-template-columns: 1fr;
      }

      .tools {
        grid-template-columns: repeat(2, minmax(0,1fr));
      }

      .saved-api {
        align-items: flex-start;
      }

      .remove-btn {
        padding: 8px;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <section id="loginScreen" class="login-wrap">

    <div class="login-card">

      <div class="logo">
        TXG
      </div>

      <h1>TXG Information</h1>

      <p class="muted">
        Secure admin information center
      </p>

      <form id="loginForm">

        <div class="field">
          <label>Admin Password</label>

          <input
            id="password"
            type="password"
            placeholder="Enter password"
            autocomplete="current-password"
            required
          >
        </div>

        <button
          class="btn btn-primary btn-full"
          type="submit"
        >
          Login
        </button>

        <div
          id="loginError"
          class="error"
        ></div>

      </form>

    </div>

  </section>


  <!-- APP -->
  <main id="app" class="page hidden">

    <header class="header">

      <div>
        <div class="brand-title">
          TXG Information Center
        </div>

        <div class="brand-sub">
          Information & API lookup dashboard
        </div>
      </div>

      <button
        id="logoutBtn"
        class="btn btn-danger logout"
        type="button"
      >
        Logout
      </button>

    </header>


    <!-- SEARCH -->
    <section class="search-card">

      <div class="search-row">

        <select id="searchType">

          <option value="auto">
            Auto
          </option>

          <option value="mobile">
            Mobile
          </option>

          <option value="email">
            Email
          </option>

          <option value="vehicle">
            Vehicle
          </option>

          <option value="ip">
            IP
          </option>

          <option value="url">
            URL
          </option>

          <option value="pin">
            PIN
          </option>

          <option value="ifsc">
            IFSC
          </option>

          <option value="upi">
            UPI
          </option>

          <option value="company">
            Company
          </option>

          <option value="crm">
            CRM
          </option>

        </select>


        <input
          id="searchInput"
          type="text"
          placeholder="Enter search value..."
        >


        <button
          id="searchBtn"
          class="btn btn-primary"
          type="button"
        >
          Search
        </button>

      </div>

      <div
        id="searchMessage"
        class="notice hidden"
      ></div>

    </section>


    <!-- FIXED TOOLS -->
    <div class="section-title">
      Tools
    </div>

    <section class="tools">

      <button class="tool" data-type="auto">
        Auto
        <small>Automatic detection</small>
      </button>

      <button class="tool" data-type="mobile">
        Mobile
        <small>Mobile information</small>
      </button>

      <button class="tool" data-type="email">
        Email
        <small>Email & domain information</small>
      </button>

      <button class="tool" data-type="vehicle">
        Vehicle
        <small>Vehicle information</small>
      </button>

      <button class="tool" data-type="ip">
        IP
        <small>IP information</small>
      </button>

      <button class="tool" data-type="url">
        URL
        <small>URL & domain analysis</small>
      </button>

      <button class="tool" data-type="pin">
        PIN
        <small>Postal information</small>
      </button>

      <button class="tool" data-type="ifsc">
        IFSC
        <small>Bank & branch information</small>
      </button>

      <button class="tool" data-type="upi">
        UPI
        <small>UPI format validation</small>
      </button>

      <button class="tool" data-type="company">
        Company
        <small>Company information</small>
      </button>

      <button class="tool" data-type="crm">
        CRM
        <small>Connected CRM search</small>
      </button>

      <button
        class="tool"
        type="button"
        onclick="openCustomManager()"
      >
        Custom API
        <small>Manage your saved APIs</small>
      </button>

    </section>


    <!-- CUSTOM API MANAGER -->
    <section
      id="customManager"
      class="manager hidden"
    >

      <div class="manager-head">

        <h2>
          Custom API Manager
        </h2>

        <button
          id="closeManagerBtn"
          class="btn"
          type="button"
        >
          Close
        </button>

      </div>


      <form id="customApiForm">

        <div class="field">
          <label>API Name</label>

          <input
            id="apiName"
            type="text"
            placeholder="Example: Phone API"
            required
          >
        </div>


        <div class="field">
          <label>API URL</label>

          <input
            id="apiUrl"
            type="url"
            placeholder="https://example.com/api?value={message}"
            required
          >
        </div>


        <div class="field">
          <label>Method</label>

          <select id="apiMethod">

            <option value="GET">
              GET
            </option>

            <option value="POST">
              POST
            </option>

            <option value="PUT">
              PUT
            </option>

            <option value="PATCH">
              PATCH
            </option>

            <option value="DELETE">
              DELETE
            </option>

          </select>
        </div>


        <div class="field">
          <label>Description</label>

          <textarea
            id="apiDescription"
            placeholder="Optional description"
          ></textarea>
        </div>


        <button
          class="btn btn-success btn-full"
          type="submit"
        >
          Save API
        </button>

      </form>


      <div class="section-title">
        Saved APIs
      </div>

      <div
        id="savedApis"
        class="api-list"
      ></div>

    </section>


    <!-- RESULTS -->
    <section
      id="results"
      class="results"
    ></section>

  </main>


<script>
"use strict";


/* ==========================================
   GLOBAL HELPERS
========================================== */

const $ = (id) =>
  document.getElementById(id);


let loggedIn = false;


/* ==========================================
   SAFE JSON RESPONSE
========================================== */

async function readResponse(response) {

  const text =
    await response.text();

  let data = null;

  try {

    data =
      text
        ? JSON.parse(text)
        : {};

  } catch {

    throw new Error(
      text ||
      `Server returned HTTP ${response.status}`
    );

  }

  if (!response.ok) {

    throw new Error(
      data?.error ||
      data?.message ||
      `Request failed with HTTP ${response.status}`
    );

  }

  return data;
}


/* ==========================================
   SHOW MESSAGE
========================================== */

function showMessage(
  message,
  isError = false
) {

  const box =
    $("searchMessage");

  box.textContent =
    message;

  box.classList.remove(
    "hidden"
  );

  box.style.color =
    isError
      ? "#ff8e98"
      : "#9ba5b5";
}


/* ==========================================
   AUTH CHECK
========================================== */

async function checkLogin() {

  try {

    const response =
      await fetch(
        "/api/auth",
        {
          method: "GET",
          credentials: "include",
          cache: "no-store"
        }
      );

    const data =
      await readResponse(
        response
      );

    if (
      data.authenticated
    ) {

      showApp();

    } else {

      showLogin();

    }

  } catch {

    showLogin();

  }
}


/* ==========================================
   SHOW LOGIN
========================================== */

function showLogin() {

  loggedIn = false;

  $("loginScreen")
    .classList.remove(
      "hidden"
    );

  $("app")
    .classList.add(
      "hidden"
    );
}


/* ==========================================
   SHOW APP
========================================== */

function showApp() {

  loggedIn = true;

  $("loginScreen")
    .classList.add(
      "hidden"
    );

  $("app")
    .classList.remove(
      "hidden"
    );

  loadSavedApis();
}


/* ==========================================
   LOGIN
========================================== */

$("loginForm")
  .addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();

      const password =
        $("password").value;

      $("loginError")
        .textContent =
        "Logging in...";

      try {

        const response =
          await fetch(
            "/api/auth",
            {
              method: "POST",
              credentials: "include",
              headers: {
                "Content-Type":
                  "application/json"
              },
              body: JSON.stringify({
                action: "login",
                password
              })
            }
          );

        const data =
          await readResponse(
            response
          );

        if (
          data.authenticated
        ) {

          $("password")
            .value = "";

          $("loginError")
            .textContent = "";

          showApp();

        } else {

          throw new Error(
            "Login failed."
          );

        }

      } catch (error) {

        $("loginError")
          .textContent =
          error.message ||
          "Login failed.";

      }

    }
  );


/* ==========================================
   LOGOUT
========================================== */

$("logoutBtn")
  .addEventListener(
    "click",
    async () => {

      try {

        await fetch(
          "/api/auth",
          {
            method: "POST",
            credentials: "include",
            headers: {
              "Content-Type":
                "application/json"
            },
            body: JSON.stringify({
              action: "logout"
            })
          }
        );

      } catch {}

      $("results")
        .innerHTML = "";

      showLogin();

    }
  );


/* ==========================================
   TOOL BUTTONS
========================================== */

document
  .querySelectorAll(
    ".tool[data-type]"
  )
  .forEach(
    (button) => {

      button.addEventListener(
        "click",
        () => {

          const type =
            button.dataset.type;

          $("searchType")
            .value =
            type;

          $("searchInput")
            .focus();

          showMessage(
            `Selected: ${type}`
          );

        }
      );

    }
  );


/* ==========================================
   SEARCH
========================================== */

$("searchBtn")
  .addEventListener(
    "click",
    runSearch
  );


$("searchInput")
  .addEventListener(
    "keydown",
    (event) => {

      if (
        event.key === "Enter"
      ) {

        event.preventDefault();

        runSearch();

      }

    }
  );


async function runSearch() {

  const type =
    $("searchType").value;

  const value =
    $("searchInput")
      .value
      .trim();

  if (!value) {

    showMessage(
      "Enter a value to search.",
      true
    );

    return;
  }

  showMessage(
    "Searching..."
  );

  $("results")
    .innerHTML = "";

  try {

    const url =
      "/api/lookup" +
      "?type=" +
      encodeURIComponent(type) +
      "&value=" +
      encodeURIComponent(value);

    const response =
      await fetch(
        url,
        {
          method: "GET",
          credentials: "include",
          cache: "no-store"
        }
      );

    const data =
      await readResponse(
        response
      );

    renderResults(
      data
    );

    showMessage(
      "Search completed."
    );

  } catch (error) {

    showMessage(
      error.message ||
      "Search failed.",
      true
    );

    $("results")
      .innerHTML =
      createResultCard(
        "Error",
        "Failed",
        {
          error:
            error.message
        }
      );

  }

}


/* ==========================================
   RESULT RENDER
========================================== */

function createResultCard(
  title,
  status,
  data
) {

  const safeTitle =
    escapeHtml(
      title || "Result"
    );

  const safeStatus =
    escapeHtml(
      status || "Result"
    );

  let formatted;

  try {

    formatted =
      JSON.stringify(
        data,
        null,
        2
      );

  } catch {

    formatted =
      String(data);

  }

  return `
    <div class="result-card">

      <div class="result-title">
        ${safeTitle}
      </div>

      <div class="result-status">
        ${safeStatus}
      </div>

      <pre>${escapeHtml(
        formatted
      )}</pre>

    </div>
  `;

}


function renderResults(data) {

  const results =
    $("results");

  results.innerHTML = "";

  if (!data) {

    results.innerHTML =
      createResultCard(
        "Result",
        "Empty",
        {}
      );

    return;
  }


  if (
    Array.isArray(
      data.results
    )
  ) {

    data.results.forEach(
      (item) => {

        results.innerHTML +=
          createResultCard(
            item.name ||
            item.type ||
            "Result",

            item.status ||
            "Completed",

            item.data ||
            item
          );

      }
    );

    return;
  }


  if (
    Array.isArray(
      data.data
    )
  ) {

    data.data.forEach(
      (item) => {

        results.innerHTML +=
          createResultCard(
            item.name ||
            "Result",

            item.status ||
            "Completed",

            item
          );

      }
    );

    return;
  }


  results.innerHTML =
    createResultCard(
      "Result",
      data.ok === false
        ? "Error"
        : "Completed",
      data
    );

}


/* ==========================================
   CUSTOM MANAGER
========================================== */

function openCustomManager() {

  $("customManager")
    .classList.remove(
      "hidden"
    );

  loadSavedApis();

  $("customManager")
    .scrollIntoView({
      behavior: "smooth",
      block: "start"
    });

}


window.openCustomManager =
  openCustomManager;


$("closeManagerBtn")
  .addEventListener(
    "click",
    () => {

      $("customManager")
        .classList.add(
          "hidden"
        );

    }
  );


/* ==========================================
   LOAD SAVED APIS
========================================== */

async function loadSavedApis() {

  const container =
    $("savedApis");

  container.innerHTML =
    `<div class="empty">
      Loading saved APIs...
    </div>`;

  try {

    const response =
      await fetch(
        "/api/custom-apis",
        {
          method: "GET",
          credentials: "include",
          cache: "no-store"
        }
      );

    const data =
      await readResponse(
        response
      );

    const apis =
      Array.isArray(
        data.apis
      )
        ? data.apis
        : [];

    renderSavedApis(
      apis
    );

  } catch (error) {

    container.innerHTML =
      `<div class="empty">
        ${escapeHtml(
          error.message ||
          "Could not load saved APIs."
        )}
      </div>`;

  }

}


/* ==========================================
   RENDER SAVED APIS
========================================== */

function renderSavedApis(
  apis
) {

  const container =
    $("savedApis");

  container.innerHTML = "";

  if (!apis.length) {

    container.innerHTML =
      `<div class="empty">
        No saved APIs yet.
      </div>`;

    return;
  }


  apis.forEach(
    (api) => {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "saved-api";


      const info =
        document.createElement(
          "div"
        );

      info.className =
        "saved-api-info";


      const name =
        document.createElement(
          "div"
        );

      name.className =
        "saved-api-name";

      name.textContent =
        api.name ||
        "Unnamed API";


      const url =
        document.createElement(
          "div"
        );

      url.className =
        "saved-api-url";

      url.textContent =
        `${api.method || "GET"} • ${
          api.url || ""
        }`;


      info.appendChild(
        name
      );

      info.appendChild(
        url
      );


      const remove =
        document.createElement(
          "button"
        );

      remove.type =
        "button";

      remove.className =
        "remove-btn";

      remove.textContent =
        "× Remove";


      remove.addEventListener(
        "click",
        () => {

          removeSavedApi(
            api.id,
            api.name
          );

        }
      );


      row.appendChild(
        info
      );

      row.appendChild(
        remove
      );

      container.appendChild(
        row
      );

    }
  );

}


/* ==========================================
   REMOVE SAVED API
========================================== */

async function removeSavedApi(
  id,
  name
) {

  if (!id) {

    showMessage(
      "This API has no valid ID.",
      true
    );

    return;
  }


  const confirmed =
    window.confirm(
      `Remove "${name || "this API"}"?`
    );

  if (!confirmed) {
    return;
  }


  showMessage(
    "Removing API..."
  );


  try {

    const response =
      await fetch(
        "/api/custom-apis?id=" +
        encodeURIComponent(id),
        {
          method: "DELETE",
          credentials: "include",
          cache: "no-store"
        }
      );


    const data =
      await readResponse(
        response
      );


    if (
      data.ok
    ) {

      showMessage(
        "API removed successfully."
      );

      await loadSavedApis();

    } else {

      throw new Error(
        data.error ||
        "Remove failed."
      );

    }

  } catch (error) {

    showMessage(
      error.message ||
      "Could not remove API.",
      true
    );

  }

}


/* ==========================================
   ADD CUSTOM API
========================================== */

$("customApiForm")
  .addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();


      const name =
        $("apiName")
          .value
          .trim();


      const url =
        $("apiUrl")
          .value
          .trim();


      const method =
        $("apiMethod")
          .value;


      const description =
        $("apiDescription")
          .value
          .trim();


      if (!name || !url) {

        showMessage(
          "API name and URL are required.",
          true
        );

        return;
      }


      showMessage(
        "Saving API..."
      );


      try {

        const response =
          await fetch(
            "/api/custom-apis",
            {
              method: "POST",
              credentials: "include",
              headers: {
                "Content-Type":
                  "application/json"
              },
              body:
                JSON.stringify({
                  name,
                  url,
                  method,
                  description,
                  category:
                    "Custom API"
                })
            }
          );


        const data =
          await readResponse(
            response
          );


        if (!data.ok) {

          throw new Error(
            data.error ||
            "API save failed."
          );

        }


        $("apiName")
          .value = "";

        $("apiUrl")
          .value = "";

        $("apiDescription")
          .value = "";


        await loadSavedApis();


        showMessage(
          "API saved successfully."
        );


      } catch (error) {

        showMessage(
          error.message ||
          "Could not save API.",
          true
        );

      }

    }
  );


/* ==========================================
   HTML ESCAPE
========================================== */

function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}
