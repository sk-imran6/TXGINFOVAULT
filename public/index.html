<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta
 name="viewport"
 content="width=device-width,initial-scale=1"
>

<title>TXG Information</title>

<style>

*{
 box-sizing:border-box;
}

body{
 margin:0;
 background:#07090f;
 color:#fff;
 font-family:Arial,sans-serif;
}

.login{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
}

.card{
 width:100%;
 max-width:430px;
 background:#101521;
 border:1px solid #252c3b;
 border-radius:22px;
 padding:25px;
}

.logo{
 font-size:28px;
 font-weight:bold;
 margin-bottom:10px;
}

input{
 width:100%;
 padding:14px;
 margin:8px 0;
 background:#080b11;
 color:white;
 border:1px solid #293141;
 border-radius:12px;
 outline:none;
}

button{
 border:0;
 padding:13px 18px;
 border-radius:12px;
 background:#7157ff;
 color:white;
 font-weight:bold;
 cursor:pointer;
}

.login button{
 width:100%;
 margin-top:10px;
}

#panel{
 display:none;
 padding:20px;
 max-width:1200px;
 margin:auto;
}

.header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:25px;
}

.tools{
 display:grid;
 grid-template-columns:
 repeat(auto-fit,minmax(260px,1fr));
 gap:15px;
}

.tool{
 background:#101521;
 border:1px solid #252c3b;
 border-radius:18px;
 padding:18px;
}

.tool h3{
 margin-top:0;
}

.row{
 display:flex;
 gap:7px;
}

.row button{
 white-space:nowrap;
}

.result{
 margin-top:12px;
 padding:12px;
 background:#080b11;
 border-radius:12px;
 font-size:13px;
 overflow:auto;
}

.line{
 padding:7px 0;
 border-bottom:1px solid #202635;
}

.key{
 color:#8f99ab;
}

.error{
 color:#ff526d;
 margin-top:10px;
}

@media(max-width:600px){

 .row{
  flex-direction:column;
 }

 .header{
  align-items:flex-start;
 }

}

</style>

</head>

<body>

<div
 id="login"
 class="login"
>

<div class="card">

<div class="logo">
TXG INFORMATION
</div>

<p>
Secure Information Center
</p>

<input
 id="password"
 type="password"
 placeholder="Admin Password"
>

<button onclick="enter()">
ENTER PANEL
</button>

<div
 id="loginError"
 class="error"
></div>

</div>

</div>


<div id="panel">

<div class="header">

<div>

<h1>TXG Information</h1>

<div>
Mobile • UPI • IFSC • PIN • Email • IP
</div>

</div>

<button onclick="logout()">
Logout
</button>

</div>


<div class="tools">


<div class="tool">

<h3>📱 Mobile</h3>

<input
 id="mobile"
 placeholder="+91 9876543210"
>

<button
 onclick="search('mobile','mobile')"
>
Search
</button>

<div id="mobileResult"></div>

</div>


<div class="tool">

<h3>💳 UPI</h3>

<input
 id="upi"
 placeholder="example@upi"
>

<button
 onclick="search('upi','upi')"
>
Search
</button>

<div id="upiResult"></div>

</div>


<div class="tool">

<h3>🏦 IFSC</h3>

<input
 id="ifsc"
 placeholder="SBIN0000001"
>

<button
 onclick="search('ifsc','ifsc')"
>
Search
</button>

<div id="ifscResult"></div>

</div>


<div class="tool">

<h3>📮 PIN Code</h3>

<input
 id="pin"
 placeholder="700001"
>

<button
 onclick="search('pin','pin')"
>
Search
</button>

<div id="pinResult"></div>

</div>


<div class="tool">

<h3>📧 Email</h3>

<input
 id="email"
 placeholder="user@example.com"
>

<button
 onclick="search('email','email')"
>
Search
</button>

<div id="emailResult"></div>

</div>


<div class="tool">

<h3>🌐 IP Address</h3>

<input
 id="ip"
 placeholder="8.8.8.8"
>

<button
 onclick="search('ip','ip')"
>
Search
</button>

<div id="ipResult"></div>

</div>


</div>

</div>


<script>

const PASSWORD =
"TXG@Admin#2026!Secure";


function enter(){

 const p =
 document.getElementById(
  "password"
 ).value;

 if(p !== PASSWORD){

  document.getElementById(
   "loginError"
  ).textContent =
   "Wrong password.";

  return;
 }

 sessionStorage.setItem(
  "txg_login",
  "1"
 );

 document.getElementById(
  "login"
 ).style.display="none";

 document.getElementById(
  "panel"
 ).style.display="block";
}


function logout(){

 sessionStorage.removeItem(
  "txg_login"
 );

 location.reload();
}


if(
 sessionStorage.getItem(
  "txg_login"
 ) === "1"
){

 document.getElementById(
  "login"
 ).style.display="none";

 document.getElementById(
  "panel"
 ).style.display="block";
}


async function search(type,id){

 const value =
 document.getElementById(id)
 .value.trim();

 const output =
 document.getElementById(
  id+"Result"
 );

 if(!value){

  output.innerHTML =
   '<div class="error">Enter value.</div>';

  return;
 }

 output.innerHTML =
  "Searching...";

 try{

  const response =
   await fetch("/api/lookup",{

    method:"POST",

    headers:{
     "Content-Type":
      "application/json",

     "x-txg-key":
      PASSWORD
    },

    body:JSON.stringify({
     type,
     value
    })

   });

  const data =
   await response.json();

  if(!response.ok){

   throw new Error(
    data.error || "Failed"
   );

  }

  output.innerHTML =
   render(data.data);

 }catch(e){

  output.innerHTML =
   `<div class="error">
   ${escapeHtml(e.message)}
   </div>`;

 }

}


function render(data){

 if(
  data === null ||
  data === undefined
 ){
  return "";
 }

 if(
  typeof data !== "object"
 ){
  return escapeHtml(data);
 }

 let html =
  '<div class="result">';

 for(
  const [key,value]
  of Object.entries(data)
 ){

  let display;

  if(
   typeof value === "object"
  ){

   display =
    JSON.stringify(
     value,
     null,
     2
    );

  }else{

   display =
    String(value);

  }

  html +=
   `<div class="line">
      <div class="key">
       ${escapeHtml(
        format(key)
       )}
      </div>
      <div>
       ${escapeHtml(display)}
      </div>
    </div>`;
 }

 html +=
  "</div>";

 return html;
}


function format(key){

 return String(key)
  .replace(
   /([A-Z])/g,
   " $1"
  )
  .replace(
   /^./,
   x=>x.toUpperCase()
  );

}


function escapeHtml(value){

 return String(value ?? "")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}

</script>

</body>
</html>
