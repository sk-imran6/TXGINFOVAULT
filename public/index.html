<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TXG Information</title>

<style>
:root{
  --bg:#07090d;
  --panel:#10151d;
  --panel2:#151c27;
  --line:#27313f;
  --text:#f4f7fb;
  --muted:#91a0b2;
  --accent:#6ee7b7;
  --danger:#ff8995;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  background:#07090d;
  color:var(--text);
  font-family:Inter,system-ui,Arial,sans-serif;
}

/* NO MOVING LETTERS / NO ANIMATION */
body::before,
body::after{
  content:none!important;
  display:none!important;
}

button,
input,
select{
  font:inherit;
}

.wrap{
  width:min(1160px,94%);
  margin:auto;
}

.top{
  padding:26px 0 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.logo{
  font-size:27px;
  font-weight:900;
}

.sub{
  font-size:13px;
  color:var(--muted);
  margin-top:4px;
}

.login,
.searchbox,
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:22px;
}

.login{
  max-width:430px;
  margin:80px auto;
}

.login h1{
  margin:0 0 5px;
}

.input,
.btn,
select{
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--text);
  border-radius:12px;
  padding:12px 14px;
  outline:none;
}

.input:focus,
select:focus{
  border-color:var(--accent);
}

.btn{
  cursor:pointer;
}

.primary{
  background:var(--accent);
  color:#06100b;
  border:0;
  font-weight:850;
}

.logout{
  color:#ff9da7;
}

.hidden{
  display:none!important;
}

.login .input{
  width:100%;
  margin:18px 0 10px;
}

.login .primary{
  width:100%;
}

.searchrow{
  display:grid;
  grid-template-columns:1fr 135px;
  gap:10px;
}

.searchrow .input{
  width:100%;
}

.tools{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:14px;
}

.tool{
  width:100%;
  min-height:46px;
  text-align:center;
  font-weight:750;
}

.tool.active{
  color:var(--accent);
  border-color:var(--accent);
}

.saved-api{
  border-color:#344456;
}

.saved-api.active{
  color:var(--accent);
  border-color:var(--accent);
}

.customPanel{
  margin-top:14px;
  padding-top:16px;
  border-top:1px solid var(--line);
}

.customForm{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.customForm .full{
  grid-column:1/-1;
}

.savedManager{
  margin-top:18px;
}

.managerTitle{
  color:var(--muted);
  font-size:13px;
  margin-bottom:9px;
}

.managerList{
  display:grid;
  gap:8px;
}

.managerRow{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  align-items:center;
}

.managerName{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  text-align:left;
}

.removeBtn{
  color:var(--danger);
  border-color:#4a2930;
  min-width:82px;
}

.status{
  font-size:13px;
  color:var(--muted);
  margin-top:12px;
}

.ok{
  color:#9bf2c9;
}

.error{
  color:var(--danger);
}

.results{
  display:grid;
  gap:14px;
  margin:16px 0 40px;
}

.head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  border-bottom:1px solid var(--line);
  padding-bottom:11px;
  margin-bottom:11px;
}

.name{
  font-weight:850;
}

.source{
  font-size:11px;
  color:var(--accent);
  border:1px solid #2b5144;
  border-radius:99px;
  padding:4px 8px;
}

pre{
  white-space:pre-wrap;
  overflow:auto;
  font-size:12px;
  line-height:1.6;
  margin:0;
  color:#dce4ed;
}

@media(max-width:650px){

  .searchrow{
    grid-template-columns:1fr;
  }

  .searchrow .btn{
    width:100%;
  }

  .customForm{
    grid-template-columns:1fr;
  }

  .customForm .full{
    grid-column:auto;
  }

  .top{
    align-items:flex-start;
  }
}
</style>
</head>

<body>

<div class="wrap">

<header class="top">

  <div>
    <div class="logo">TXG Information</div>
    <div class="sub">Information & API Center</div>
  </div>

  <button
    id="logout"
    class="btn logout hidden"
    type="button"
  >
    Logout
  </button>

</header>


<!-- ================================
     LOGIN
================================ -->

<section id="loginBox" class="login">

  <h1>Admin Login</h1>

  <div class="sub">
    Secure admin access
  </div>

  <input
    id="password"
    class="input"
    type="password"
    placeholder="Admin password"
    autocomplete="current-password"
  >

  <button
    id="login"
    class="btn primary"
    type="button"
  >
    Login
  </button>

  <div
    id="loginMsg"
    class="status"
  ></div>

</section>


<!-- ================================
     MAIN APP
================================ -->

<main id="app" class="hidden">

<section class="searchbox">

  <div class="searchrow">

    <input
      id="query"
      class="input"
      placeholder="Enter search value..."
    >

    <button
      id="search"
      class="btn primary"
      type="button"
    >
      Search
    </button>

  </div>


  <!--
    FIXED TOOLS
    ↓
    SAVED CUSTOM APIS
    ↓
    CUSTOM API
  -->

  <div
    id="tools"
    class="tools"
  ></div>


  <!-- ================================
       CUSTOM API MANAGER
  ================================= -->

  <div
    id="customPanel"
    class="customPanel hidden"
  >

    <div class="customForm">

      <input
        id="apiName"
        class="input"
        placeholder="API Name"
      >

      <input
        id="apiUrl"
        class="input"
        placeholder="API URL (use {message})"
      >

      <input
        id="apiKey"
        class="input"
        type="password"
        placeholder="API Key (optional)"
      >

      <input
        id="apiHeader"
        class="input"
        value="Authorization"
        placeholder="Header name"
      >

      <select
        id="apiMethod"
        class="input"
      >
        <option value="GET">GET</option>
        <option value="POST">POST</option>
      </select>

      <button
        id="addApi"
        class="btn primary"
        type="button"
      >
        + Save API
      </button>

    </div>


    <!-- REMOVE API SECTION -->

    <div class="savedManager">

      <div class="managerTitle">
        Manage Saved APIs
      </div>

      <div
        id="managerList"
        class="managerList"
      ></div>

    </div>

  </div>


  <div
    id="status"
    class="status"
  >
    Ready.
  </div>

</section>


<section
  id="results"
  class="results"
></section>

</main>

</div>


<script>

/* ==========================================
   FIXED TOOLS
========================================== */

const builtInTools = [

  ["auto","Auto"],
  ["mobile","Mobile"],
  ["email","Email"],
  ["vehicle","Vehicle"],
  ["ip","IP"],
  ["url","URL"],
  ["pin","PIN"],
  ["ifsc","IFSC"],
  ["upi","UPI"],
  ["company","Company"],
  ["crm","CRM"]

];


/* ==========================================
   STATE
========================================== */

let selected = "auto";
let selectedApiId = "";
let customApis = [];


/* ==========================================
   HELPER
========================================== */

const $ = id =>
  document.getElementById(id);


/* ==========================================
   STATUS
========================================== */

function setStatus(
  text,
  type=""
){

  const el = $("status");

  el.textContent = text;

  el.className =
    "status " + type;

}


/* ==========================================
   CREATE TOOL BUTTON
========================================== */

function addToolButton(
  key,
  label,
  extraClass=""
){

  const button =
    document.createElement("button");

  button.type = "button";

  button.className =
    "btn tool " +
    extraClass +
    (
      key === selected
        ? " active"
        : ""
    );

  button.textContent =
    label;


  button.addEventListener(
    "click",
    () => {

      selected = key;

      if(
        key.startsWith("custom:")
      ){

        selectedApiId =
          key.substring(7);

      }else{

        selectedApiId = "";

      }

      drawTools();

    }
  );


  $("tools")
    .appendChild(button);

}


/* ==========================================
   DRAW BUTTONS
========================================== */

function drawTools(){

  $("tools").innerHTML = "";


  /* FIXED BUTTONS */

  builtInTools.forEach(
    ([key,label]) => {

      addToolButton(
        key,
        label
      );

    }
  );


  /*
    SAVED CUSTOM APIs

    They ALWAYS appear before
    the Custom API button.
  */

  customApis.forEach(
    api => {

      addToolButton(
        "custom:" + api.id,
        api.name,
        "saved-api"
      );

    }
  );


  /*
    CUSTOM API ALWAYS LAST
  */

  addToolButton(
    "custom-manager",
    "Custom API"
  );


  /*
    CUSTOM API MANAGER
  */

  $("customPanel")
    .classList
    .toggle(
      "hidden",
      selected !== "custom-manager"
    );


  drawManager();

}


/* ==========================================
   REMOVE MANAGER
========================================== */

function drawManager(){

  const list =
    $("managerList");

  list.innerHTML = "";


  if(
    customApis.length === 0
  ){

    const empty =
      document.createElement("div");

    empty.className =
      "status";

    empty.textContent =
      "No saved APIs.";

    list.appendChild(empty);

    return;
  }


  customApis.forEach(
    api => {

      const row =
        document.createElement("div");

      row.className =
        "managerRow";


      const name =
        document.createElement("button");

      name.type = "button";

      name.className =
        "btn managerName";

      name.textContent =
        api.name;


      /*
        SELECT API
      */

      name.addEventListener(
        "click",
        () => {

          selected =
            "custom:" + api.id;

          selectedApiId =
            String(api.id);

          drawTools();

          setStatus(
            "Selected: " + api.name,
            "ok"
          );

        }
      );


      /*
        REMOVE API
      */

      const remove =
        document.createElement("button");

      remove.type = "button";

      remove.className =
        "btn removeBtn";

      remove.textContent =
        "× Remove";


      remove.addEventListener(
        "click",
        () => {

          removeCustomApi(
            api.id
          );

        }
      );


      row.append(
        name,
        remove
      );


      list.appendChild(row);

    }
  );

}


/* ==========================================
   LOAD CUSTOM APIs
========================================== */

async function loadCustomApis(){

  try{

    const response =
      await fetch(
        "/api/custom-apis",
        {
          method:"GET",
          cache:"no-store"
        }
      );


    if(
      response.status === 401
    ){

      showLogin();
      return;

    }


    const data =
      await response.json();


    customApis =
      Array.isArray(data.apis)
        ? data.apis
        : [];


    drawTools();


  }catch(error){

    customApis = [];

    drawTools();

    setStatus(
      "Could not load saved APIs.",
      "error"
    );

  }

}


/* ==========================================
   ADD CUSTOM API
========================================== */

async function saveCustomApi(){

  const name =
    $("apiName")
      .value
      .trim();

  const url =
    $("apiUrl")
      .value
      .trim();

  const key =
    $("apiKey").value;

  const header =
    $("apiHeader")
      .value
      .trim()
      ||
      "Authorization";

  const method =
    $("apiMethod").value;


  if(!name){

    setStatus(
      "Enter API name.",
      "error"
    );

    return;
  }


  if(!url){

    setStatus(
      "Enter API URL.",
      "error"
    );

    return;
  }


  setStatus(
    "Saving API..."
  );


  try{

    const response =
      await fetch(
        "/api/custom-apis",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              name:name,
              url:url,
              key:key,
              header:header,
              method:method

            })
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "Could not save API."
      );

    }


    customApis =
      Array.isArray(data.apis)
        ? data.apis
        : [];


    /* CLEAR FORM */

    $("apiName").value = "";
    $("apiUrl").value = "";
    $("apiKey").value = "";


    /* SELECT NEW API */

    const newest =
      customApis[
        customApis.length - 1
      ];


    if(newest){

      selected =
        "custom:" +
        newest.id;

      selectedApiId =
        String(newest.id);

    }


    drawTools();


    setStatus(
      "API added successfully.",
      "ok"
    );


  }catch(error){

    setStatus(
      error.message,
      "error"
    );

  }

}


/* ==========================================
   REMOVE CUSTOM API
========================================== */

async function removeCustomApi(id){

  const api =
    customApis.find(
      item =>
        String(item.id) ===
        String(id)
    );


  if(!api){
    return;
  }


  const confirmed =
    window.confirm(
      'Remove "' +
      api.name +
      '" permanently?'
    );


  if(!confirmed){
    return;
  }


  setStatus(
    "Removing API..."
  );


  try{

    const response =
      await fetch(
        "/api/custom-apis",
        {
          method:"DELETE",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              id:id
            })
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "Could not remove API."
      );

    }


    customApis =
      Array.isArray(data.apis)
        ? data.apis
        : [];


    /*
      IF CURRENT API WAS REMOVED
    */

    if(
      String(selectedApiId) ===
      String(id)
    ){

      selected =
        "custom-manager";

      selectedApiId = "";

    }


    drawTools();


    setStatus(
      "API removed successfully.",
      "ok"
    );


  }catch(error){

    setStatus(
      error.message,
      "error"
    );

  }

}


/* ==========================================
   LOGIN
========================================== */

async function login(){

  const password =
    $("password").value;


  if(!password){

    $("loginMsg").textContent =
      "Enter password.";

    $("loginMsg").className =
      "status error";

    return;
  }


  $("loginMsg").textContent =
    "Checking...";

  $("loginMsg").className =
    "status";


  try{

    const response =
      await fetch(
        "/api/auth",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              action:"login",
              password:password
            })
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "Login failed."
      );

    }


    showApp();


  }catch(error){

    $("loginMsg").textContent =
      error.message;

    $("loginMsg").className =
      "status error";

  }

}


/* ==========================================
   LOGOUT
========================================== */

async function logout(){

  try{

    await fetch(
      "/api/auth",
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({
            action:"logout"
          })
      }
    );

  }finally{

    showLogin();

  }

}


/* ==========================================
   SHOW APP
========================================== */

function showApp(){

  $("loginBox")
    .classList
    .add("hidden");

  $("app")
    .classList
    .remove("hidden");

  $("logout")
    .classList
    .remove("hidden");


  drawTools();

  loadCustomApis();

}


/* ==========================================
   SHOW LOGIN
========================================== */

function showLogin(){

  $("loginBox")
    .classList
    .remove("hidden");

  $("app")
    .classList
    .add("hidden");

  $("logout")
    .classList
    .add("hidden");

}


/* ==========================================
   RENDER RESULTS
========================================== */

function renderResults(data){

  const root =
    $("results");

  root.innerHTML = "";


  if(
    !data.results ||
    !data.results.length
  ){

    const empty =
      document.createElement("div");

    empty.className =
      "card";

    empty.textContent =
      "No results returned.";

    root.appendChild(empty);

    return;
  }


  data.results.forEach(
    item => {

      const card =
        document.createElement("article");

      card.className =
        "card";


      const head =
        document.createElement("div");

      head.className =
        "head";


      const name =
        document.createElement("div");

      name.className =
        "name";

      name.textContent =
        item.name ||
        "RESULT";


      const source =
        document.createElement("div");

      source.className =
        "source";

      source.textContent =
        (
          item.source ||
          "SOURCE"
        ) +
        " · " +
        (
          item.status ||
          "success"
        );


      const pre =
        document.createElement("pre");


      pre.textContent =
        typeof item.data === "string"
          ? item.data
          : JSON.stringify(
              item.data,
              null,
              2
            );


      head.append(
        name,
        source
      );

      card.append(
        head,
        pre
      );

      root.appendChild(card);

    }
  );

}


/* ==========================================
   SEARCH
========================================== */

async function search(){

  const value =
    $("query")
      .value
      .trim();


  if(!value){

    setStatus(
      "Enter a value first.",
      "error"
    );

    return;
  }


  setStatus(
    "Searching..."
  );


  $("results").innerHTML = "";


  try{

    let url;


    if(
      selected.startsWith("custom:")
    ){

      url =
        "/api/lookup" +
        "?type=custom" +
        "&api_id=" +
        encodeURIComponent(
          selectedApiId
        ) +
        "&value=" +
        encodeURIComponent(
          value
        );

    }else{

      url =
        "/api/lookup" +
        "?type=" +
        encodeURIComponent(
          selected
        ) +
        "&value=" +
        encodeURIComponent(
          value
        );

    }


    const response =
      await fetch(
        url,
        {
          cache:"no-store"
        }
      );


    const data =
      await response.json();


    if(
      response.status === 401
    ){

      showLogin();

      $("loginMsg").textContent =
        "Session expired. Login again.";

      $("loginMsg").className =
        "status error";

      return;
    }


    if(!response.ok){

      throw new Error(
        data.error ||
        "Lookup failed."
      );

    }


    renderResults(data);


    setStatus(
      (
        data.result_count ||
        0
      ) +
      " result block(s) returned.",
      "ok"
    );


  }catch(error){

    const card =
      document.createElement("div");

    card.className =
      "card error";

    card.textContent =
      error.message;


    $("results")
      .appendChild(card);


    setStatus(
      "Search failed.",
      "error"
    );

  }

}


/* ==========================================
   EVENTS
========================================== */

$("login")
  .addEventListener(
    "click",
    login
  );

$("logout")
  .addEventListener(
    "click",
    logout
  );

$("search")
  .addEventListener(
    "click",
    search
  );

$("addApi")
  .addEventListener(
    "click",
    saveCustomApi
  );


$("password")
  .addEventListener(
    "keydown",
    event => {

      if(event.key === "Enter"){
        login();
      }

    }
  );


$("query")
  .addEventListener(
    "keydown",
    event => {

      if(event.key === "Enter"){
        search();
      }

    }
  );


/* ==========================================
   CHECK LOGIN SESSION
========================================== */

fetch(
  "/api/auth",
  {
    method:"GET",
    cache:"no-store"
  }
)
.then(
  response =>
    response.json()
)
.then(
  data => {

    if(data.authenticated){

      showApp();

    }else{

      showLogin();

    }

  }
)
.catch(
  () => {

    showLogin();

  }
);

</script>

</body>
</html>
