<!-- index.html -->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TXG Information</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080b10;
  color: #f5f7fa;
  font-family: Arial, sans-serif;
}

.container {
  width: min(1100px, 94%);
  margin: 25px auto;
}

h1 {
  margin-bottom: 5px;
}

.subtitle {
  color: #8f98a8;
  margin-bottom: 25px;
}

.tools {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 10px;
}

.tool {
  border: 1px solid #242b36;
  background: #11161e;
  color: #fff;
  padding: 14px 10px;
  border-radius: 12px;
  cursor: pointer;
  transition: .2s;
}

.tool:hover,
.tool.active {
  border-color: #4d8dff;
  background: #172236;
}

.search-box {
  margin-top: 20px;
  display: flex;
  gap: 10px;
}

input,
select,
textarea {
  width: 100%;
  background: #0e131a;
  border: 1px solid #29313d;
  color: #fff;
  padding: 13px;
  border-radius: 10px;
  outline: none;
}

input:focus,
select:focus,
textarea:focus {
  border-color: #4d8dff;
}

button {
  cursor: pointer;
}

.search-btn,
.add-btn {
  border: 0;
  background: #2563eb;
  color: white;
  padding: 0 20px;
  border-radius: 10px;
  font-weight: 700;
}

.section {
  margin-top: 25px;
  background: #0d1219;
  border: 1px solid #202733;
  border-radius: 15px;
  padding: 18px;
}

.section h2 {
  margin-top: 0;
}

.hidden {
  display: none;
}

.result {
  margin-top: 15px;
  background: #070a0f;
  border: 1px solid #202733;
  border-radius: 12px;
  padding: 15px;
  overflow: auto;
}

pre {
  margin: 0;
  white-space: pre-wrap;
  word-break: break-word;
}

.custom-form {
  display: grid;
  gap: 12px;
}

.saved-list {
  display: grid;
  gap: 12px;
  margin-top: 18px;
}

.api-card {
  background: #11161e;
  border: 1px solid #252d38;
  border-radius: 13px;
  padding: 15px;
}

.api-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
}

.api-name {
  font-weight: 700;
  font-size: 16px;
}

.api-meta {
  color: #8791a1;
  font-size: 12px;
  margin-top: 5px;
}

.api-url {
  color: #6fa2ff;
  font-size: 12px;
  margin-top: 8px;
  word-break: break-all;
}

.api-actions {
  display: flex;
  gap: 8px;
  margin-top: 13px;
  flex-wrap: wrap;
}

.run-btn,
.delete-btn {
  border: 0;
  padding: 9px 13px;
  border-radius: 8px;
  color: #fff;
  font-weight: 600;
}

.run-btn {
  background: #16803c;
}

.delete-btn {
  background: #b4232f;
}

.api-runner {
  display: none;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid #252d38;
}

.api-runner.show {
  display: block;
}

.runner-row {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}

.runner-row button {
  border: 0;
  background: #2563eb;
  color: #fff;
  padding: 0 18px;
  border-radius: 9px;
}

.status {
  margin-top: 12px;
  color: #8f98a8;
}

@media(max-width:600px) {
  .search-box,
  .runner-row {
    flex-direction: column;
  }

  .search-btn,
  .add-btn,
  .runner-row button {
    height: 46px;
  }
}
</style>
</head>

<body>

<div class="container">

  <h1>TXG Information</h1>
  <div class="subtitle">
    Information & API Lookup Center
  </div>

  <div class="tools">

    <button class="tool active" data-type="auto">Auto</button>
    <button class="tool" data-type="mobile">Mobile</button>
    <button class="tool" data-type="email">Email</button>
    <button class="tool" data-type="vehicle">Vehicle</button>
    <button class="tool" data-type="ip">IP</button>
    <button class="tool" data-type="url">URL</button>
    <button class="tool" data-type="pin">PIN</button>
    <button class="tool" data-type="ifsc">IFSC</button>
    <button class="tool" data-type="upi">UPI</button>
    <button class="tool" data-type="company">Company</button>
    <button class="tool" data-type="crm">CRM</button>
    <button class="tool" data-type="custom">Custom API</button>

  </div>

  <div id="lookupSection" class="section">

    <h2 id="lookupTitle">Information Search</h2>

    <div class="search-box">

      <input
        id="lookupInput"
        type="text"
        placeholder="Enter information..."
        autocomplete="off"
      >

      <button
        id="lookupButton"
        class="search-btn"
        type="button"
      >
        Search
      </button>

    </div>

    <div id="lookupStatus" class="status"></div>

    <div id="lookupResult" class="result hidden">
      <pre id="lookupOutput"></pre>
    </div>

  </div>

  <div id="customSection" class="section">

    <h2>Custom APIs</h2>

    <div class="custom-form">

      <input
        id="apiName"
        type="text"
        placeholder="API name"
      >

      <input
        id="apiUrl"
        type="url"
        placeholder="https://example.com/api?value={message}"
      >

      <select id="apiMethod">
        <option value="GET">GET</option>
        <option value="POST">POST</option>
        <option value="PUT">PUT</option>
        <option value="PATCH">PATCH</option>
        <option value="DELETE">DELETE</option>
      </select>

      <input
        id="apiCategory"
        type="text"
        placeholder="Category e.g. PIN / IFSC / Email"
        value="Custom"
      >

      <textarea
        id="apiDescription"
        rows="3"
        placeholder="Description"
      ></textarea>

      <button
        id="addApiButton"
        class="add-btn"
        type="button"
      >
        Add Custom API
      </button>

    </div>

    <div id="apiStatus" class="status"></div>

    <div id="savedApis" class="saved-list"></div>

  </div>

</div>

<script>
"use strict";

let selectedType = "auto";
let customApiList = [];

const tools = document.querySelectorAll(".tool");
const lookupInput = document.getElementById("lookupInput");
const lookupButton = document.getElementById("lookupButton");
const lookupTitle = document.getElementById("lookupTitle");
const lookupStatus = document.getElementById("lookupStatus");
const lookupResult = document.getElementById("lookupResult");
const lookupOutput = document.getElementById("lookupOutput");

const apiName = document.getElementById("apiName");
const apiUrl = document.getElementById("apiUrl");
const apiMethod = document.getElementById("apiMethod");
const apiCategory = document.getElementById("apiCategory");
const apiDescription = document.getElementById("apiDescription");
const addApiButton = document.getElementById("addApiButton");
const apiStatus = document.getElementById("apiStatus");
const savedApis = document.getElementById("savedApis");

const placeholders = {
  auto: "Enter mobile, email, IP, PIN, IFSC, UPI, URL...",
  mobile: "Enter mobile number...",
  email: "Enter email address...",
  vehicle: "Enter vehicle registration number...",
  ip: "Enter IP address...",
  url: "Enter URL or domain...",
  pin: "Enter PIN code...",
  ifsc: "Enter IFSC code...",
  upi: "Enter UPI ID...",
  company: "Enter company name...",
  crm: "Enter CRM search value...",
  custom: "Enter search value..."
};

tools.forEach(button => {
  button.addEventListener("click", () => {

    tools.forEach(item => {
      item.classList.remove("active");
    });

    button.classList.add("active");

    selectedType = button.dataset.type || "auto";

    lookupInput.placeholder =
      placeholders[selectedType] ||
      placeholders.auto;

    lookupTitle.textContent =
      selectedType === "custom"
        ? "Custom API"
        : "Information Search";

    lookupInput.focus();
  });
});

lookupButton.addEventListener("click", performLookup);

lookupInput.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    performLookup();
  }
});

async function performLookup() {

  const query = lookupInput.value.trim();

  if (!query) {
    lookupStatus.textContent =
      "Enter a value first.";
    return;
  }

  lookupStatus.textContent = "Searching...";
  lookupResult.classList.add("hidden");
  lookupOutput.textContent = "";

  try {

    const url =
      "/api/lookup?q=" +
      encodeURIComponent(query) +
      "&query=" +
      encodeURIComponent(query) +
      "&type=" +
      encodeURIComponent(selectedType);

    const response = await fetch(url);

    const data = await response.json();

    if (!response.ok || data.success === false) {
      throw new Error(
        data.error || "Lookup failed"
      );
    }

    lookupOutput.textContent =
      JSON.stringify(data, null, 2);

    lookupResult.classList.remove("hidden");

    lookupStatus.textContent =
      "Search completed.";

  } catch (error) {

    lookupStatus.textContent =
      error.message || "Search failed.";

    lookupOutput.textContent =
      JSON.stringify({
        success: false,
        error: error.message
      }, null, 2);

    lookupResult.classList.remove("hidden");
  }
}

addApiButton.addEventListener(
  "click",
  addCustomApi
);

async function addCustomApi() {

  const name = apiName.value.trim();
  const url = apiUrl.value.trim();
  const method = apiMethod.value;
  const category = apiCategory.value.trim() || "Custom";
  const description = apiDescription.value.trim();

  if (!name) {
    apiStatus.textContent =
      "API name is required.";
    return;
  }

  if (!url) {
    apiStatus.textContent =
      "API URL is required.";
    return;
  }

  try {

    new URL(url);

  } catch {

    apiStatus.textContent =
      "Invalid API URL.";
    return;
  }

  if (!url.startsWith("https://")) {
    apiStatus.textContent =
      "Only HTTPS URLs are allowed.";
    return;
  }

  apiStatus.textContent =
    "Adding API...";

  try {

    const response = await fetch(
      "/api/custom-apis",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          name,
          url,
          method,
          category,
          description
        })
      }
    );

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(
        data.error || "Failed to add API"
      );
    }

    apiName.value = "";
    apiUrl.value = "";
    apiMethod.value = "GET";
    apiCategory.value = "Custom";
    apiDescription.value = "";

    apiStatus.textContent =
      "API added successfully.";

    await loadSavedApis();

  } catch (error) {

    apiStatus.textContent =
      error.message || "Failed to add API";
  }
}

async function loadSavedApis() {

  savedApis.innerHTML =
    "<div class='status'>Loading APIs...</div>";

  try {

    const response = await fetch(
      "/api/custom-apis"
    );

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(
        data.error || "Failed to load APIs"
      );
    }

    customApiList =
      Array.isArray(data.apis)
        ? data.apis
        : [];

    renderSavedApis();

  } catch (error) {

    savedApis.innerHTML =
      "<div class='status'>" +
      escapeHtml(
        error.message || "Failed to load APIs"
      ) +
      "</div>";
  }
}

function renderSavedApis() {

  if (!customApiList.length) {

    savedApis.innerHTML =
      "<div class='status'>No custom APIs saved.</div>";

    return;
  }

  savedApis.innerHTML =
    customApiList.map(api => {

      const id = String(api.id || "");

      return `
        <div class="api-card">

          <div class="api-top">

            <div>
              <div class="api-name">
                ${escapeHtml(api.name || "Unnamed API")}
              </div>

              <div class="api-meta">
                ${escapeHtml(api.category || "Custom")}
                ·
                ${escapeHtml(api.method || "GET")}
              </div>
            </div>

          </div>

          <div class="api-url">
            ${escapeHtml(api.url || "")}
          </div>

          ${
            api.description
              ? `<div class="api-meta">
                  ${escapeHtml(api.description)}
                 </div>`
              : ""
          }

          <div class="api-actions">

            <button
              type="button"
              class="run-btn"
              data-action="run"
              data-id="${escapeAttribute(id)}"
            >
              Search
            </button>

            <button
              type="button"
              class="delete-btn"
              data-action="delete"
              data-id="${escapeAttribute(id)}"
            >
              Delete
            </button>

          </div>

          <div
            class="api-runner"
            id="runner-${safeId(id)}"
          >

            <input
              type="text"
              class="runner-input"
              placeholder="${escapeAttribute(
                getApiPlaceholder(api)
              )}"
              data-id="${escapeAttribute(id)}"
            >

            <div class="runner-row">

              <button
                type="button"
                data-action="execute"
                data-id="${escapeAttribute(id)}"
              >
                Run API
              </button>

            </div>

            <div
              class="status"
              data-status="${escapeAttribute(id)}"
            ></div>

            <div
              class="result hidden"
              data-result="${escapeAttribute(id)}"
            >
              <pre data-output="${escapeAttribute(id)}"></pre>
            </div>

          </div>

        </div>
      `;

    }).join("");

  bindApiButtons();
}

function bindApiButtons() {

  savedApis
    .querySelectorAll("[data-action='run']")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          const id =
            String(
              button.dataset.id || ""
            ).trim();

          const runner =
            document.getElementById(
              "runner-" + safeId(id)
            );

          if (!runner) return;

          runner.classList.add("show");

          const input =
            runner.querySelector(
              ".runner-input"
            );

          if (input) {
            input.focus();
          }
        }
      );
    });

  savedApis
    .querySelectorAll("[data-action='delete']")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          const id =
            String(
              button.dataset.id || ""
            ).trim();

          deleteCustomApi(id);
        }
      );
    });

  savedApis
    .querySelectorAll("[data-action='execute']")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          const id =
            String(
              button.dataset.id || ""
            ).trim();

          runCustomApi(id);
        }
      );
    });

  savedApis
    .querySelectorAll(".runner-input")
    .forEach(input => {

      input.addEventListener(
        "keydown",
        event => {

          if (event.key !== "Enter") {
            return;
          }

          runCustomApi(
            String(
              input.dataset.id || ""
            ).trim()
          );
        }
      );
    });
}

async function runCustomApi(id) {

  const apiId =
    String(id || "").trim();

  if (!apiId) {
    return;
  }

  const runner =
    document.getElementById(
      "runner-" + safeId(apiId)
    );

  if (!runner) {
    return;
  }

  const input =
    runner.querySelector(
      ".runner-input"
    );

  const status =
    runner.querySelector(
      ".status"
    );

  const result =
    runner.querySelector(
      ".result"
    );

  const output =
    runner.querySelector(
      "pre"
    );

  const message =
    String(
      input?.value || ""
    ).trim();

  if (!message) {

    status.textContent =
      "Enter a value first.";

    return;
  }

  status.textContent =
    "Running API...";

  result.classList.add("hidden");
  output.textContent = "";

  try {

    const response = await fetch(
      "/api/custom-proxy?id=" +
      encodeURIComponent(apiId) +
      "&message=" +
      encodeURIComponent(message)
    );

    const data =
      await response.json();

    if (!response.ok || !data.success) {
      throw new Error(
        data.error || "API request failed"
      );
    }

    output.textContent =
      JSON.stringify(data, null, 2);

    result.classList.remove("hidden");

    status.textContent =
      "Completed.";

  } catch (error) {

    status.textContent =
      error.message ||
      "API request failed.";

    output.textContent =
      JSON.stringify({
        success: false,
        error: error.message
      }, null, 2);

    result.classList.remove("hidden");
  }
}

async function deleteCustomApi(id) {

  const apiId =
    String(
      typeof id === "object"
        ? id?.id || ""
        : id || ""
    ).trim();

  if (
    !apiId ||
    apiId === "[object Object]"
  ) {
    alert(
      "Valid API ID is required"
    );
    return;
  }

  if (
    !confirm(
      "Delete this API?"
    )
  ) {
    return;
  }

  try {

    const response = await fetch(
      "/api/custom-apis?id=" +
      encodeURIComponent(apiId),
      {
        method: "DELETE"
      }
    );

    const data =
      await response.json();

    if (
      !response.ok ||
      !data.success
    ) {
      throw new Error(
        data.error ||
        "Delete failed"
      );
    }

    await loadSavedApis();

  } catch (error) {

    alert(
      error.message ||
      "Delete failed"
    );
  }
}

function getApiPlaceholder(api) {

  const text =
    (
      String(api?.name || "") +
      " " +
      String(api?.category || "") +
      " " +
      String(api?.url || "")
    ).toLowerCase();

  if (
    text.includes("pin") ||
    text.includes("postal")
  ) {
    return "Enter PIN code...";
  }

  if (
    text.includes("ifsc") ||
    text.includes("bank")
  ) {
    return "Enter IFSC code...";
  }

  if (
    text.includes("email")
  ) {
    return "Enter email address...";
  }

  if (
    text.includes("mobile") ||
    text.includes("phone") ||
    text.includes("number")
  ) {
    return "Enter mobile number...";
  }

  if (
    text.includes("vehicle") ||
    text.includes("rc")
  ) {
    return "Enter vehicle number...";
  }

  if (
    text.includes("ip")
  ) {
    return "Enter IP address...";
  }

  if (
    text.includes("url") ||
    text.includes("domain")
  ) {
    return "Enter URL/domain...";
  }

  if (
    text.includes("upi")
  ) {
    return "Enter UPI ID...";
  }

  return "Enter search value...";
}

function safeId(value) {

  return String(value || "")
    .replace(
      /[^a-zA-Z0-9_-]/g,
      "_"
    );
}

function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function escapeAttribute(value) {
  return escapeHtml(value);
}

loadSavedApis();
</script>

</body>
</html>
