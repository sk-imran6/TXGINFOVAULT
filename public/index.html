<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TXG Information Center</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#080b10;
  color:#f4f7fb;
  font-family:Inter,Arial,sans-serif;
}

.container{
  width:min(1050px,100%);
  margin:auto;
  padding:18px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
}

.logo{
  font-size:24px;
  font-weight:800;
}

.subtitle{
  color:#8792a3;
  font-size:13px;
  margin-top:4px;
}

.status{
  padding:8px 12px;
  border:1px solid #26313e;
  border-radius:999px;
  color:#7ff0a0;
  font-size:12px;
}

.card{
  background:#10151d;
  border:1px solid #202a35;
  border-radius:17px;
  padding:16px;
  margin-bottom:15px;
}

.tools{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
  gap:9px;
}

button{
  border:1px solid #2a3543;
  background:#151c25;
  color:#f2f5f8;
  border-radius:11px;
  padding:12px;
  cursor:pointer;
  font-size:14px;
}

button:hover{
  background:#1b2633;
  border-color:#4c8dff;
}

button.active{
  background:#172b48;
  border-color:#4c8dff;
}

.search-row{
  display:grid;
  grid-template-columns:1fr 145px 105px;
  gap:9px;
}

input,select{
  width:100%;
  border:1px solid #2a3543;
  background:#0b1016;
  color:#fff;
  border-radius:11px;
  padding:13px;
  outline:none;
}

input:focus,select:focus{
  border-color:#4c8dff;
}

.result{
  margin-top:12px;
  min-height:220px;
  max-height:600px;
  overflow:auto;
  white-space:pre-wrap;
  word-break:break-word;
  background:#080c11;
  border:1px solid #202a35;
  border-radius:12px;
  padding:14px;
  font:13px/1.55 monospace;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.full{
  grid-column:1/-1;
}

.saved{
  display:grid;
  gap:8px;
  margin-top:13px;
}

.saved-item{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
}

.saved-run{
  text-align:left;
}

.delete{
  color:#ff8d8d;
}

.small{
  color:#8792a3;
  font-size:12px;
}

@media(max-width:650px){
  .container{
    padding:12px;
  }

  .search-row{
    grid-template-columns:1fr;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .header{
    align-items:flex-start;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">

    <div>
      <div class="logo">TXG Information Center</div>
      <div class="subtitle">
        Public & authorized information lookup
      </div>
    </div>

    <div class="status">
      DIRECT ACCESS
    </div>

  </div>


  <!-- TOOLS -->

  <div class="card">

    <div class="tools" id="tools">

      <button data-type="auto">Auto</button>

      <button data-type="mobile">
        Mobile
      </button>

      <button data-type="email">
        Email
      </button>

      <button data-type="vehicle">
        Vehicle
      </button>

      <button data-type="ip">
        IP
      </button>

      <button data-type="url">
        URL
      </button>

      <button data-type="pin">
        PIN
      </button>

      <button data-type="ifsc">
        IFSC
      </button>

      <button data-type="upi">
        UPI
      </button>

      <button data-type="company">
        Company
      </button>

      <button data-type="crm">
        CRM
      </button>

    </div>

  </div>


  <!-- SEARCH -->

  <div class="card">

    <div class="search-row">

      <input
        id="query"
        type="text"
        placeholder="Enter search value..."
      >

      <select id="type">

        <option value="auto">
          Auto
        </option>

        <option value="mobile">
          Mobile
        </option>

        <option value="email">
          Email
        </option>

        <option value="vehicle">
          Vehicle
        </option>

        <option value="ip">
          IP
        </option>

        <option value="url">
          URL / Domain
        </option>

        <option value="pin">
          PIN
        </option>

        <option value="ifsc">
          IFSC
        </option>

        <option value="upi">
          UPI
        </option>

        <option value="company">
          Company
        </option>

        <option value="crm">
          CRM
        </option>

      </select>

      <button id="searchBtn">
        Search
      </button>

    </div>

  </div>


  <!-- RESULT -->

  <div class="card">

    <div style="
      display:flex;
      justify-content:space-between;
      gap:10px;
    ">

      <strong>
        Result
      </strong>

      <span
        class="small"
        id="statusText"
      >
        Ready
      </span>

    </div>

    <pre
      class="result"
      id="result"
    >Ready.</pre>

  </div>


  <!-- CUSTOM API -->

  <div class="card">

    <h3 style="margin-top:0;">
      Custom API
    </h3>

    <div class="grid">

      <input
        id="apiName"
        placeholder="API name"
      >

      <input
        id="apiCategory"
        placeholder="Category"
      >

      <input
        class="full"
        id="apiUrl"
        placeholder="https://example.com/api?message={message}"
      >

      <select id="apiMethod">

        <option value="GET">
          GET
        </option>

        <option value="POST">
          POST
        </option>

        <option value="PUT">
          PUT
        </option>

        <option value="PATCH">
          PATCH
        </option>

        <option value="DELETE">
          DELETE
        </option>

      </select>

      <input
        id="apiDescription"
        placeholder="Description"
      >

    </div>

    <button
      id="addApiBtn"
      style="margin-top:10px;"
    >
      + Add Custom API
    </button>


    <div
      class="small"
      style="margin-top:12px;"
    >
      Saved APIs
    </div>

    <div
      class="saved"
      id="savedApis"
    >
      Loading...
    </div>

  </div>

</div>


<script>

const $ = id => document.getElementById(id);

let selectedType = "auto";


/* =========================
   TOOL SELECTION
========================= */

document
  .querySelectorAll("#tools button")
  .forEach(button => {

    button.addEventListener("click", () => {

      selectedType =
        button.dataset.type;

      $("type").value =
        selectedType;

      document
        .querySelectorAll("#tools button")
        .forEach(x =>
          x.classList.remove("active")
        );

      button.classList.add("active");

    });

  });


$("type").addEventListener(
  "change",
  event => {

    selectedType =
      event.target.value;

  }
);


/* =========================
   SEARCH
========================= */

$("searchBtn").addEventListener(
  "click",
  runLookup
);


$("query").addEventListener(
  "keydown",
  event => {

    if(event.key === "Enter"){
      runLookup();
    }

  }
);


async function runLookup(){

  const value =
    $("query").value.trim();

  const type =
    $("type").value;

  if(!value){

    $("result").textContent =
      "Please enter a value.";

    return;

  }

  $("statusText").textContent =
    "Searching...";

  $("result").textContent =
    "Loading...";

  try{

    const url =
      "/api/lookup?type=" +
      encodeURIComponent(type) +
      "&value=" +
      encodeURIComponent(value);

    const response =
      await fetch(url);

    const data =
      await response.json();

    $("result").textContent =
      JSON.stringify(
        data,
        null,
        2
      );

    $("statusText").textContent =
      data.success
        ? "Done"
        : "Error";

  }catch(error){

    $("statusText").textContent =
      "Error";

    $("result").textContent =
      error.message;

  }

}


/* =========================
   ADD CUSTOM API
========================= */

$("addApiBtn").addEventListener(
  "click",
  addCustomApi
);


async function addCustomApi(){

  const payload = {

    name:
      $("apiName").value.trim(),

    url:
      $("apiUrl").value.trim(),

    method:
      $("apiMethod").value,

    category:
      $("apiCategory").value.trim()
      || "Custom API",

    description:
      $("apiDescription").value.trim()

  };


  if(!payload.name){

    alert("Enter API name.");

    return;

  }


  if(!payload.url){

    alert("Enter API URL.");

    return;

  }


  try{

    $("addApiBtn").disabled =
      true;

    $("addApiBtn").textContent =
      "Saving...";


    const response =
      await fetch(
        "/api/custom-apis",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(payload)
        }
      );


    const data =
      await response.json();


    if(!data.success){

      alert(
        data.error ||
        "Unable to save API."
      );

      return;

    }


    $("apiName").value = "";
    $("apiUrl").value = "";
    $("apiCategory").value = "";
    $("apiDescription").value = "";


    await loadSavedApis();


  }catch(error){

    alert(error.message);

  }finally{

    $("addApiBtn").disabled =
      false;

    $("addApiBtn").textContent =
      "+ Add Custom API";

  }

}


/* =========================
   LOAD SAVED APIs
========================= */

async function loadSavedApis(){

  const box =
    $("savedApis");

  box.innerHTML =
    '<span class="small">Loading...</span>';


  try{

    const response =
      await fetch(
        "/api/custom-apis"
      );

    const data =
      await response.json();


    if(!data.success){

      box.innerHTML =
        `<span class="small">
          ${escapeHtml(
            data.error ||
            "Unable to load APIs"
          )}
        </span>`;

      return;

    }


    box.innerHTML = "";


    if(
      !data.apis ||
      !data.apis.length
    ){

      box.innerHTML =
        '<span class="small">No saved APIs yet.</span>';

      return;

    }


    data.apis.forEach(
      api => {

        const row =
          document.createElement(
            "div"
          );

        row.className =
          "saved-item";


        const run =
          document.createElement(
            "button"
          );

        run.className =
          "saved-run";


        run.textContent =
          api.name +
          "  ·  " +
          api.method;


        run.addEventListener(
          "click",
          () =>
            runSavedApi(api)
        );


        const del =
          document.createElement(
            "button"
          );

        del.className =
          "delete";

        del.textContent =
          "Delete";


        del.addEventListener(
          "click",
          () =>
            deleteSavedApi(api.id)
        );


        row.appendChild(run);
        row.appendChild(del);

        box.appendChild(row);

      }
    );


  }catch(error){

    box.innerHTML =
      `<span class="small">
        ${escapeHtml(
          error.message
        )}
      </span>`;

  }

}


/* =========================
   RUN SAVED API
========================= */

async function runSavedApi(api){

  const message =
    $("query").value.trim();


  $("statusText").textContent =
    "Running API...";

  $("result").textContent =
    "Loading...";


  try{

    const url =
      "/api/custom-proxy?id=" +
      encodeURIComponent(api.id) +
      "&message=" +
      encodeURIComponent(message);


    const response =
      await fetch(url);


    const data =
      await response.json();


    $("result").textContent =
      JSON.stringify(
        data,
        null,
        2
      );


    $("statusText").textContent =
      data.success
        ? "Done"
        : "API Error";


  }catch(error){

    $("statusText").textContent =
      "Error";

    $("result").textContent =
      error.message;

  }

}


/* =========================
   DELETE API
========================= */

async function deleteSavedApi(id){

  if(
    !confirm(
      "Delete this saved API?"
    )
  ){

    return;

  }


  try{

    const response =
      await fetch(
        "/api/custom-apis?id=" +
        encodeURIComponent(id),
        {
          method:"DELETE"
        }
      );


    const data =
      await response.json();


    if(!data.success){

      alert(
        data.error ||
        "Delete failed."
      );

      return;

    }


    loadSavedApis();


  }catch(error){

    alert(error.message);

  }

}


/* =========================
   HTML ESCAPE
========================= */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================
   START
========================= */

loadSavedApis();

</script>

</body>
</html>
