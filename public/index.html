<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05070a">
<title>TXG Information</title>

<style>
:root{
  color-scheme:dark;
  --bg:#05070a;
  --bg2:#090d13;
  --card:#0d1219;
  --card2:#111821;
  --line:#1e2936;
  --line2:#334155;
  --text:#f5f7fa;
  --muted:#8492a3;
  --accent:#8b5cf6;
  --accent2:#a78bfa;
  --green:#4ade80;
  --red:#fb7185;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(
      circle at 15% 0%,
      rgba(139,92,246,.10),
      transparent 28%
    ),
    linear-gradient(
      145deg,
      var(--bg),
      var(--bg2)
    );
  color:var(--text);
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

/* NO MOVING BACKGROUND */

.wrap{
  width:min(1180px,94%);
  margin:auto;
  position:relative;
}

.top{
  padding:28px 0 22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:13px;
}

.brandIcon{
  width:46px;
  height:46px;
  border-radius:14px;
  display:grid;
  place-items:center;
  font-size:18px;
  font-weight:950;
  color:#fff;
  background:linear-gradient(
    135deg,
    #7c3aed,
    #4f46e5
  );
  box-shadow:
    0 10px 35px
    rgba(124,58,237,.22);
}

.logo{
  font-size:24px;
  font-weight:950;
  letter-spacing:-.6px;
}

.sub{
  font-size:12px;
  color:var(--muted);
  margin-top:3px;
}

.btn,
.input,
select{
  border:1px solid var(--line);
  background:rgba(17,24,33,.92);
  color:var(--text);
  border-radius:12px;
  padding:12px 14px;
  font:inherit;
  outline:none;
}

.input:focus,
select:focus{
  border-color:var(--accent);
  box-shadow:
    0 0 0 3px
    rgba(139,92,246,.12);
}

.btn{
  cursor:pointer;
  transition:
    transform .18s ease,
    border-color .18s ease,
    background .18s ease;
}

.btn:hover{
  transform:translateY(-1px);
  border-color:var(--line2);
  background:#151d28;
}

.btn:active{
  transform:translateY(0);
}

.primary{
  background:
    linear-gradient(
      135deg,
      #8b5cf6,
      #6d28d9
    );
  color:#fff;
  border:0;
  font-weight:850;
  box-shadow:
    0 8px 25px
    rgba(109,40,217,.22);
}

.primary:hover{
  background:
    linear-gradient(
      135deg,
      #9b6cff,
      #7c3aed
    );
}

.logout{
  color:#fda4af;
}

.hidden{
  display:none!important;
}

/* LOGIN */

.login{
  max-width:430px;
  margin:75px auto;
  padding:30px;
  background:rgba(13,18,25,.96);
  border:1px solid var(--line);
  border-radius:24px;
  box-shadow:
    0 25px 80px rgba(0,0,0,.4),
    0 0 50px
    rgba(124,58,237,.06);
}

.loginBadge{
  display:inline-flex;
  padding:6px 10px;
  border-radius:999px;
  background:rgba(139,92,246,.10);
  border:1px solid
    rgba(139,92,246,.25);
  color:#c4b5fd;
  font-size:11px;
  font-weight:800;
  margin-bottom:15px;
}

.login h1{
  margin:0;
  font-size:28px;
  letter-spacing:-.8px;
}

.login .input{
  width:100%;
  margin:20px 0 10px;
}

.login .primary{
  width:100%;
}

/* SEARCH */

.searchbox{
  background:rgba(13,18,25,.94);
  border:1px solid var(--line);
  border-radius:22px;
  padding:18px;
  box-shadow:
    0 20px 60px
    rgba(0,0,0,.18);
}

.searchrow{
  display:grid;
  grid-template-columns:1fr 125px;
  gap:10px;
}

.searchrow .input{
  width:100%;
  height:48px;
}

.searchrow .btn{
  height:48px;
}

.tools{
  display:grid;
  grid-template-columns:
    repeat(6,1fr);
  gap:8px;
  margin-top:14px;
}

.tool{
  min-height:43px;
  font-size:12px;
  font-weight:750;
  color:#aeb9c7;
}

.tool.active{
  color:#fff;
  border-color:
    rgba(139,92,246,.7);
  background:
    rgba(139,92,246,.13);
  box-shadow:
    inset 0 0 0 1px
    rgba(139,92,246,.08);
}

/* CUSTOM API */

.customPanel{
  margin-top:15px;
  padding:17px;
  border-radius:17px;
  background:rgba(8,12,17,.78);
  border:1px solid var(--line);
}

.customTitle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.customTitle strong{
  font-size:14px;
}

.customTitle span{
  color:var(--muted);
  font-size:11px;
}

.customGrid{
  display:grid;
  grid-template-columns:
    1fr 1fr;
  gap:9px;
}

.customGrid .input,
.customGrid select{
  width:100%;
}

.savedTitle{
  margin-top:15px;
  color:var(--muted);
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.6px;
}

.saved{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:9px;
}

.savedItem{
  display:flex;
  gap:5px;
  align-items:center;
}

.savedItem .btn{
  font-size:12px;
}

.danger{
  color:#fb7185;
  padding:9px 11px;
}

/* STATUS */

.status{
  font-size:12px;
  color:var(--muted);
  margin-top:12px;
}

.ok{
  color:#86efac;
}

.error{
  color:#fb7185;
}

/* RESULTS */

.results{
  display:grid;
  gap:12px;
  margin:17px 0 45px;
}

.card{
  background:rgba(13,18,25,.95);
  border:1px solid var(--line);
  border-radius:19px;
  padding:18px;
  box-shadow:
    0 12px 40px
    rgba(0,0,0,.14);
}

.head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  border-bottom:1px solid var(--line);
  padding-bottom:12px;
  margin-bottom:12px;
}

.name{
  font-size:14px;
  font-weight:900;
}

.source{
  font-size:10px;
  color:#c4b5fd;
  border:1px solid
    rgba(139,92,246,.3);
  background:
    rgba(139,92,246,.08);
  border-radius:999px;
  padding:5px 9px;
  white-space:nowrap;
}

.state{
  font-size:12px;
  color:var(--muted);
}

pre{
  white-space:pre-wrap;
  overflow:auto;
  font-size:12px;
  line-height:1.65;
  margin:0;
  color:#dce4ed;
}

/* MOBILE */

@media(max-width:850px){

  .tools{
    grid-template-columns:
      repeat(4,1fr);
  }

}

@media(max-width:600px){

  .top{
    padding-top:20px;
  }

  .logo{
    font-size:20px;
  }

  .brandIcon{
    width:40px;
    height:40px;
    border-radius:12px;
  }

  .searchrow{
    grid-template-columns:1fr;
  }

  .searchrow .btn{
    width:100%;
  }

  .tools{
    grid-template-columns:
      repeat(3,1fr);
  }

  .customGrid{
    grid-template-columns:1fr;
  }

  .login{
    margin:45px auto;
    padding:24px;
  }

}

@media(max-width:380px){

  .tools{
    grid-template-columns:
      repeat(2,1fr);
  }

}
</style>
</head>

<body>

<div class="wrap">

<header class="top">

  <div class="brand">

    <div class="brandIcon">
      TX
    </div>

    <div>
      <div class="logo">
        TXG Information
      </div>

      <div class="sub">
        Information & Authorized Lookup Center
      </div>
    </div>

  </div>

  <button
    id="logout"
    class="btn logout hidden"
    type="button"
  >
    Logout
  </button>

</header>


<section
  id="loginBox"
  class="login"
>

  <div class="loginBadge">
    TXG • ADMIN ACCESS
  </div>

  <h1>
    Welcome Back
  </h1>

  <div class="sub">
    Secure server-side administrator session.
  </div>

  <input
    id="password"
    class="input"
    type="password"
    placeholder="Enter admin password"
    autocomplete="current-password"
  >

  <button
    id="login"
    class="btn primary"
    type="button"
  >
    Login to Dashboard
  </button>

  <div
    id="loginMsg"
    class="status"
    aria-live="polite"
  ></div>

</section>


<main
  id="app"
  class="hidden"
>

<section class="searchbox">

  <div class="searchrow">

    <input
      id="query"
      class="input"
      placeholder="Enter mobile, email, IP, URL, PIN, IFSC, UPI…"
      autocomplete="off"
    >

    <button
      id="search"
      class="btn primary"
      type="button"
    >
      Search
    </button>

  </div>


  <div
    id="tools"
    class="tools"
  ></div>


  <div
    id="customPanel"
    class="customPanel hidden"
  >

    <div class="customTitle">

      <strong>
        Custom API Manager
      </strong>

      <span>
        Save once • Use anytime
      </span>

    </div>


    <div class="customGrid">

      <input
        id="apiName"
        class="input"
        placeholder="API Name"
        autocomplete="off"
      >

      <input
        id="apiUrl"
        class="input"
        placeholder="API URL — use {message}"
        autocomplete="off"
      >

      <input
        id="apiKey"
        class="input"
        placeholder="API Key (optional)"
        type="password"
        autocomplete="off"
      >

      <input
        id="apiHeader"
        class="input"
        placeholder="Header name"
        value="Authorization"
        autocomplete="off"
      >

      <select
        id="apiMethod"
        class="input"
      >
        <option value="GET">
          GET
        </option>

        <option value="POST">
          POST
        </option>
      </select>

      <button
        id="addApi"
        type="button"
        class="btn primary"
      >
        + Save API
      </button>

    </div>


    <div class="savedTitle">
      Saved APIs
    </div>

    <div
      id="savedApis"
      class="saved"
    ></div>

  </div>


  <div
    id="status"
    class="status"
    aria-live="polite"
  >
    Ready.
  </div>

</section>


<section
  id="results"
  class="results"
></section>

</main>

</div>


<script>

const tools = [
  ["auto","Auto"],
  ["mobile","Mobile"],
  ["email","Email"],
  ["vehicle","Vehicle"],
  ["ip","IP"],
  ["url","URL"],
  ["pin","PIN"],
  ["ifsc","IFSC"],
  ["upi","UPI"],
  ["company","Company"],
  ["crm","CRM"],
  ["custom","Custom API"]
];

let selected = "auto";
let customApis = [];
let selectedApiId = "";

const $ = id =>
  document.getElementById(id);


function setMessage(
  el,
  text,
  className = ""
){

  el.textContent = text;

  el.className =
    "status " +
    className;

}


function drawTools(){

  $("tools").innerHTML = "";

  tools.forEach(
    ([key,label]) => {

      const b =
        document.createElement(
          "button"
        );

      b.type = "button";

      b.className =
        "btn tool" +
        (
          key === selected
            ? " active"
            : ""
        );

      b.textContent = label;

      b.onclick = () => {

        selected = key;

        if(
          key !== "custom"
        ){
          selectedApiId = "";
        }

        drawTools();

      };

      $("tools").appendChild(b);

    }
  );


  $("customPanel")
    .classList
    .toggle(
      "hidden",
      selected !== "custom"
    );


  if(
    selected === "custom"
  ){
    renderSavedApis();
  }

}


async function loadCustomApis(){

  try{

    const r =
      await fetch(
        "/api/custom-apis",
        {
          cache:"no-store"
        }
      );

    if(
      r.status === 401
    ){
      return showLogin();
    }

    const d =
      await r.json();

    customApis =
      d.apis || [];

    if(
      !selectedApiId &&
      customApis[0]
    ){
      selectedApiId =
        customApis[0].id;
    }

    renderSavedApis();

  }catch(e){

    setMessage(
      $("status"),
      "Could not load saved APIs.",
      "error"
    );

  }

}


function renderSavedApis(){

  const root =
    $("savedApis");

  if(!root){
    return;
  }

  root.innerHTML = "";


  if(
    !customApis.length
  ){

    root.innerHTML =
      '<span class="status">No saved APIs yet.</span>';

    return;
  }


  customApis.forEach(
    api => {

      const wrap =
        document.createElement(
          "div"
        );

      wrap.className =
        "savedItem";


      const b =
        document.createElement(
          "button"
        );

      b.type = "button";

      b.className =
        "btn tool" +
        (
          api.id === selectedApiId
            ? " active"
            : ""
        );

      b.textContent =
        api.name;


      b.onclick = () => {

        selectedApiId =
          api.id;

        renderSavedApis();

      };


      const d =
        document.createElement(
          "button"
        );

      d.type = "button";

      d.className =
        "btn danger";

      d.textContent = "×";

      d.title =
        "Delete saved API";


      d.onclick =
        async () => {

          if(
            !confirm(
              "Delete this saved API?"
            )
          ){
            return;
          }

          const r =
            await fetch(
              "/api/custom-apis",
              {
                method:"POST",
                headers:{
                  "Content-Type":
                    "application/json"
                },
                body:
                  JSON.stringify({
                    action:"delete",
                    id:api.id
                  })
              }
            );

          const x =
            await r.json();

          if(!r.ok){

            return setMessage(
              $("status"),
              x.error ||
              "Delete failed",
              "error"
            );

          }

          customApis =
            x.apis || [];

          selectedApiId =
            customApis[0]?.id || "";

          renderSavedApis();

        };


      wrap.append(
        b,
        d
      );

      root.appendChild(
        wrap
      );

    }
  );

}


async function saveCustomApi(){

  const body = {

    name:
      $("apiName")
        .value
        .trim(),

    url:
      $("apiUrl")
        .value
        .trim(),

    key:
      $("apiKey")
        .value,

    header:
      $("apiHeader")
        .value
        .trim(),

    method:
      $("apiMethod")
        .value

  };


  if(
    !body.name ||
    !body.url
  ){

    return setMessage(
      $("status"),
      "Enter API name and URL.",
      "error"
    );

  }


  setMessage(
    $("status"),
    "Saving API…"
  );


  try{

    const r =
      await fetch(
        "/api/custom-apis",
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:
            JSON.stringify(body)
        }
      );


    const d =
      await r.json();


    if(!r.ok){

      throw new Error(
        d.error ||
        "Save failed"
      );

    }


    customApis =
      d.apis || [];

    selectedApiId =
      customApis[0]?.id || "";


    $("apiName").value = "";
    $("apiUrl").value = "";
    $("apiKey").value = "";


    renderSavedApis();


    setMessage(
      $("status"),
      "API saved successfully.",
      "ok"
    );


  }catch(e){

    setMessage(
      $("status"),
      e.message,
      "error"
    );

  }

}


function showApp(){

  $("loginBox")
    .classList
    .add("hidden");

  $("app")
    .classList
    .remove("hidden");

  $("logout")
    .classList
    .remove("hidden");

  drawTools();

  loadCustomApis();

}


function showLogin(){

  $("loginBox")
    .classList
    .remove("hidden");

  $("app")
    .classList
    .add("hidden");

  $("logout")
    .classList
    .add("hidden");

}


async function login(){

  setMessage(
    $("loginMsg"),
    "Checking…"
  );


  try{

    const r =
      await fetch(
        "/api/auth",
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:
            JSON.stringify({
              action:"login",
              password:
                $("password").value
            })
        }
      );


    const d =
      await r.json();


    if(!r.ok){

      throw new Error(
        d.error ||
        "Login failed"
      );

    }


    showApp();


  }catch(e){

    setMessage(
      $("loginMsg"),
      e.message,
      "error"
    );

  }

}


async function logout(){

  try{

    await fetch(
      "/api/auth",
      {
        method:"POST",
        headers:{
          "Content-Type":
            "application/json"
        },
        body:
          JSON.stringify({
            action:"logout"
          })
      }
    );

  }finally{

    showLogin();

  }

}


function renderResults(data){

  const root =
    $("results");

  root.innerHTML = "";


  if(
    !data.results ||
    !data.results.length
  ){

    root.innerHTML =
      '<div class="card state">No results returned.</div>';

    return;

  }


  data.results.forEach(
    item => {

      const card =
        document.createElement(
          "article"
        );

      card.className = "card";


      const head =
        document.createElement(
          "div"
        );

      head.className = "head";


      const name =
        document.createElement(
          "div"
        );

      name.className = "name";

      name.textContent =
        item.name ||
        "RESULT";


      const source =
        document.createElement(
          "div"
        );

      source.className =
        "source";

      source.textContent =
        (item.source ||
          "SOURCE") +
        " · " +
        (item.status ||
          "success");


      const pre =
        document.createElement(
          "pre"
        );

      pre.textContent =
        typeof item.data ===
        "string"
          ? item.data
          : JSON.stringify(
              item.data,
              null,
              2
            );


      head.append(
        name,
        source
      );

      card.append(
        head,
        pre
      );

      root.appendChild(
        card
      );

    }
  );

}


async function search(){

  const value =
    $("query")
      .value
      .trim();


  if(!value){

    setMessage(
      $("status"),
      "Enter a value first."
    );

    return;

  }


  if(
    selected === "custom" &&
    !selectedApiId
  ){

    setMessage(
      $("status"),
      "Select or save a Custom API first.",
      "error"
    );

    return;

  }


  setMessage(
    $("status"),
    "Searching…"
  );


  $("results").innerHTML = "";


  try{

    let url =
      "/api/lookup?type=" +
      encodeURIComponent(
        selected
      ) +
      "&value=" +
      encodeURIComponent(
        value
      );


    if(
      selected === "custom"
    ){

      url +=
        "&api_id=" +
        encodeURIComponent(
          selectedApiId
        );

    }


    const r =
      await fetch(
        url,
        {
          cache:"no-store"
        }
      );


    const d =
      await r.json();


    if(
      r.status === 401
    ){

      showLogin();

      setMessage(
        $("loginMsg"),
        "Session expired. Login again.",
        "error"
      );

      return;

    }


    if(!r.ok){

      throw new Error(
        d.error ||
        "Lookup failed"
      );

    }


    renderResults(d);


    setMessage(
      $("status"),
      `${
        d.result_count || 0
      } result block(s) returned.`,
      "ok"
    );


  }catch(e){

    $("results").innerHTML =
      `<div class="card error">${
        e.message
      }</div>`;

    setMessage(
      $("status"),
      "Search failed.",
      "error"
    );

  }

}


$("login").onclick =
  login;

$("logout").onclick =
  logout;

$("search").onclick =
  search;

$("addApi").onclick =
  saveCustomApi;


$("password")
  .addEventListener(
    "keydown",
    e => {

      if(
        e.key === "Enter"
      ){
        login();
      }

    }
  );


$("query")
  .addEventListener(
    "keydown",
    e => {

      if(
        e.key === "Enter"
      ){
        search();
      }

    }
  );


fetch(
  "/api/auth",
  {
    cache:"no-store"
  }
)
.then(
  r => r.json()
)
.then(
  d => {

    if(
      d.authenticated
    ){
      showApp();
    }else{
      showLogin();
    }

  }
)
.catch(
  showLogin
);

</script>

</body>
</html>
